# cargo-deny: supply-chain policy. Run with `just deny` or `cargo deny check`.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-musl" },
  { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — "Marvin Attack": a timing side-channel in the `rsa`
  # crate's PKCS#1 v1.5 decryption that can, given enough observations of a
  # network-visible oracle, permit private-key recovery.
  #
  # Why it is accepted rather than fixed: there is no patched release. The
  # advisory has carried no fixed version since 2023, and `rsa` is an
  # unconditional, non-optional dependency of `authkestra-engine`
  # (`[dependencies.rsa] version = "0.9.6"`, no `optional`), which vpay uses
  # to run its own OpenID Provider for /dash/v1 (ADR-0009). It cannot be
  # feature-gated away, and `authkestra-op` signs with RS256 only.
  #
  # Scope of the exposure, stated honestly rather than minimised: this is the
  # crate that signs dashboard tokens, so the advisory is on-topic, not
  # incidental. What limits it is that the attack targets PKCS#1 v1.5
  # *decryption* oracles; vpay's use is JWT *signing* and verification, so no
  # decryption oracle is exposed to a caller.
  #
  # CORRECTION (2026-08-11): an earlier version of this note claimed "the
  # merchant /v1 API does not depend on this crate". That is no longer true
  # and must not be relied on. `vpay-db` took `authkestra-op` as a real,
  # non-dev dependency in order to implement `ClientAssertionStore`, so:
  #     rsa <- authkestra-engine <- authkestra-op <- vpay-db
  #         <- vpay-api / vpay-server / vpay-worker-bin
  # with no `(dev)` marker — verified with `cargo tree -i rsa -e normal`.
  # The crate is now linked into every shipping binary and every surface,
  # not just /dash/v1. The signing-vs-decryption argument above is what
  # still limits this; the blast-radius argument no longer applies.
  #
  # Accepted deliberately by the maintainer on 2026-08-09. Revisit if a fixed
  # `rsa` release appears, if authkestra gains non-RSA signing, or if the
  # Keycloak/ZITADEL comparison ADR-0009 leaves open is ever carried out.
  #
  # This entry now genuinely fires: `cargo deny -L info check advisories`
  # reports `note[advisory-ignored]` against `rsa v0.9.10`. It was preemptive
  # when added on 2026-08-09 and is load-bearing as of 2026-08-11.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Permissive only. A copyleft dependency in a payment gateway is a legal
# question, so it must be a deliberate exception rather than a silent addition.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # CDLA-Permissive-2.0 covers `webpki-roots`, which is Mozilla's CA
  # certificate bundle — *data*, not code. It reaches the graph through
  # sqlx's `tls-rustls-ring` feature, and that feature is not negotiable:
  # the runtime image is `FROM scratch` (ADR-0004), so there is no OS trust
  # store for the `native-roots` alternative to read, and TLS to Postgres
  # would fail in the shipped image while passing everywhere else.
  # The licence itself is permissive — no copyleft, no source-disclosure
  # obligation — so it clears the bar the comment above sets for this list.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Scoped exceptions: a licence allowed for NAMED crates only, never added to
# the `allow` list above. Same standard as the `RUSTSEC-2023-0071` and
# `CDLA-Permissive-2.0` entries — say what the licence is, why it clears the
# permissive-only bar this file sets, why the exposure is bounded, and who
# decided.
#
# BLUE OAK 1.0.0, for `minicbor` and `minicbor-serde` ONLY (2026-09-06, with
# the first CrateStack read).
#
# What the licence is. The Blue Oak Model License 1.0.0 is OSI-approved and
# permissive: it grants copyright and — unlike MIT and BSD, which are silent
# on the point — an EXPRESS patent licence from every contributor, with the
# usual defensive-termination clause. There is no copyleft term, no
# source-disclosure obligation and no network-use trigger, so it clears the
# bar the `allow` list's own comment sets ("a copyleft dependency in a
# payment gateway is a legal question"). It is not on the `allow` list
# because that list is the set of licences vpay accepts *sight unseen* on any
# future dependency, and this one has been examined for exactly two crates.
#
# Why it is here at all, and why it is not avoidable. `cratestack-pg` — the
# CrateStack facade `vpay-db` compiles `schemas/vpay.cstack` with — declares
# `cratestack-axum` and `cratestack-client-rust` as NON-optional dependencies
# with no feature gating either, and both take `minicbor` unconditionally
# (`cratestack-client-rust` directly, `cratestack-axum` directly and again
# through `cratestack-codec-cbor`). Measured, not assumed: with
# `default-features = false, features = ["postgres"]` — the smallest set that
# still yields a data layer — `cargo deny check licenses` still rejects both
# crates, and `cargo tree -i minicbor` shows the two edges above. There is no
# feature combination at 0.11.1 that produces CrateStack's data layer without
# its HTTP transport; taking `cratestack-sqlx` + `cratestack-macros` directly
# does not help either, because `include_server_schema!` emits
# `pub mod axum { use ::cratestack::HttpTransport; … }` unconditionally.
# See `docs/reference/vpay-db.md` § CrateStack.
#
# Why scoped by name rather than allowed globally. Two crates, one author,
# one purpose (CBOR codec), reached through one dependency this repository
# pins exactly (`cratestack = "=0.11.1"`). A third crate arriving under Blue
# Oak is a new fact that should fail this gate and be argued on its own
# merits, which an entry on the `allow` list above would silently prevent.
# The generated CBOR transport is compiled and never called — vpay serves its
# own Stripe-shaped `/v1` — so the exposure is a linked codec, not a wire.
#
# Accepted deliberately by the maintainer on 2026-09-05, as part of the
# decision to adopt CrateStack's data layer. This entry is load-bearing from
# the moment it lands: delete it and `cargo deny check licenses` fails naming
# `minicbor` and `minicbor-serde` — the mutation is recorded in
# `docs/plans/exp14-notes/opus.md`. Revisit if CrateStack ever gates its
# transport behind a Cargo feature, at which point both crates should leave
# the graph and this exception should be deleted rather than left to rot.
exceptions = [
  { name = "minicbor", allow = ["BlueOak-1.0.0"] },
  { name = "minicbor-serde", allow = ["BlueOak-1.0.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# TLS must be rustls end to end (docs/adr/0005-rustls-only.md). openssl linked
# anywhere means something pulled in native-tls.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  # rustls has two interchangeable CryptoProvider backends, `ring` (what
  # vpay pins, see [workspace.dependencies] in root Cargo.toml) and
  # `aws-lc-rs`. Cargo will happily compile both into one binary if any
  # dependency edge asks for the latter (e.g. reqwest/authkestra's default
  # features) — and having two available providers makes
  # `rustls::crypto::CryptoProvider::install_default()` panic at runtime if
  # nothing has explicitly installed one first (rustls's own documented
  # hazard). A panic in a payment binary is exactly what this repo's lint
  # policy (docs/adr/0007, clippy `panic = "deny"`) exists to prevent, so
  # this must be caught at `cargo deny check` time, not at runtime. Any new
  # dependency that needs aws-lc-rs must instead be pointed at its
  # ring-only / no-provider feature, the way the authkestra-* crates are
  # configured above.
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
  # Exactly one sqlx major in the graph (2026-09-05). This is the property
  # the 0.8 -> 0.9 bump exists for and, until this entry, the only thing
  # holding it was a sentence in `docs/status.md`: `multiple-versions` is
  # `warn` above, so restoring `authkestra-op`'s `sqlx-postgres` feature —
  # one word in one manifest — resolved sqlx 0.8.6 *and* 0.9.0 side by side
  # with `cargo deny check` still printing "bans ok" and `just ci` still
  # green. Measured, by doing exactly that and reverting it.
  #
  # Why it matters more than tidiness: `sqlx::PgPool`, `Transaction` and
  # `Error` are different types at each major, so two majors means a
  # `vpay-db` transaction cannot be shared with any other sqlx-based crate
  # (`cratestack-sqlx` is the concrete case — see `docs/status.md`
  # § sqlx 0.8 -> 0.9), and the mismatch surfaces as an inscrutable trait
  # error in whichever crate tries it, not here.
  #
  # `sqlx-core` as well as the `sqlx` facade: it is what every `sqlx-*`
  # component funnels through, so a dependency reaching a backend crate
  # directly is caught too. Raise both bounds together when the workspace
  # moves to 0.10, in the same commit as the pin.
  { name = "sqlx", version = "<0.9" },
  { name = "sqlx-core", version = "<0.9" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
