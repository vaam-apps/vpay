# cargo-deny: supply-chain policy. Run with `just deny` or `cargo deny check`.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-musl" },
  { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — "Marvin Attack": a timing side-channel in the `rsa`
  # crate's PKCS#1 v1.5 decryption that can, given enough observations of a
  # network-visible oracle, permit private-key recovery.
  #
  # Why it is accepted rather than fixed: there is no patched release. The
  # advisory has carried no fixed version since 2023, and `rsa` is an
  # unconditional, non-optional dependency of `authkestra-engine`
  # (`[dependencies.rsa] version = "0.9.6"`, no `optional`), which vpay uses
  # to run its own OpenID Provider for /dash/v1 (ADR-0009). It cannot be
  # feature-gated away, and `authkestra-op` signs with RS256 only.
  #
  # Scope of the exposure, stated honestly rather than minimised: this is the
  # crate that signs dashboard tokens, so the advisory is on-topic, not
  # incidental. What limits it is that the attack targets PKCS#1 v1.5
  # *decryption* oracles; vpay's use is JWT *signing* and verification, so no
  # decryption oracle is exposed to a caller.
  #
  # CORRECTION (2026-08-11): an earlier version of this note claimed "the
  # merchant /v1 API does not depend on this crate". That is no longer true
  # and must not be relied on. `vpay-db` took `authkestra-op` as a real,
  # non-dev dependency in order to implement `ClientAssertionStore`, so:
  #     rsa <- authkestra-engine <- authkestra-op <- vpay-db
  #         <- vpay-api / vpay-server / vpay-worker-bin
  # with no `(dev)` marker — verified with `cargo tree -i rsa -e normal`.
  # The crate is now linked into every shipping binary and every surface,
  # not just /dash/v1. The signing-vs-decryption argument above is what
  # still limits this; the blast-radius argument no longer applies.
  #
  # Accepted deliberately by the maintainer on 2026-08-09. Revisit if a fixed
  # `rsa` release appears, if authkestra gains non-RSA signing, or if the
  # Keycloak/ZITADEL comparison ADR-0009 leaves open is ever carried out.
  #
  # This entry now genuinely fires: `cargo deny -L info check advisories`
  # reports `note[advisory-ignored]` against `rsa v0.9.10`. It was preemptive
  # when added on 2026-08-09 and is load-bearing as of 2026-08-11.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Permissive only. A copyleft dependency in a payment gateway is a legal
# question, so it must be a deliberate exception rather than a silent addition.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # CDLA-Permissive-2.0 covers `webpki-roots`, which is Mozilla's CA
  # certificate bundle — *data*, not code. It reaches the graph through
  # sqlx's `tls-rustls-ring` feature, and that feature is not negotiable:
  # the runtime image is `FROM scratch` (ADR-0004), so there is no OS trust
  # store for the `native-roots` alternative to read, and TLS to Postgres
  # would fail in the shipped image while passing everywhere else.
  # The licence itself is permissive — no copyleft, no source-disclosure
  # obligation — so it clears the bar the comment above sets for this list.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# TLS must be rustls end to end (docs/adr/0005-rustls-only.md). openssl linked
# anywhere means something pulled in native-tls.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  # rustls has two interchangeable CryptoProvider backends, `ring` (what
  # vpay pins, see [workspace.dependencies] in root Cargo.toml) and
  # `aws-lc-rs`. Cargo will happily compile both into one binary if any
  # dependency edge asks for the latter (e.g. reqwest/authkestra's default
  # features) — and having two available providers makes
  # `rustls::crypto::CryptoProvider::install_default()` panic at runtime if
  # nothing has explicitly installed one first (rustls's own documented
  # hazard). A panic in a payment binary is exactly what this repo's lint
  # policy (docs/adr/0007, clippy `panic = "deny"`) exists to prevent, so
  # this must be caught at `cargo deny check` time, not at runtime. Any new
  # dependency that needs aws-lc-rs must instead be pointed at its
  # ring-only / no-provider feature, the way the authkestra-* crates are
  # configured above.
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
