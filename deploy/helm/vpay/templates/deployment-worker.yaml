{{- include "vpay.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vpay.fullname" . }}-worker
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # More than one replica is safe — jobs are claimed with `FOR UPDATE SKIP
  # LOCKED` under a lease (migration 0021's `lock_is_paired`,
  # `jobs_claimable_idx`), so two workers never run the same job. One is the
  # default because nothing has ever measured the queue under load.
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate: during a rolling update the old and new
    # workers both hold job leases, and while that is *safe* (every handler is
    # a compare-and-swap, and a cut-off job's lease is handed back on drain),
    # it makes the drain path run concurrently with a fresh claim loop for no
    # gain — the worker serves no traffic, so there is nothing to keep
    # available across the swap.
    type: Recreate
  selector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vpay.componentLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
      {{- if or .Values.config.createOverlayConfigMap .Values.worker.podAnnotations }}
      annotations:
        {{- if .Values.config.createOverlayConfigMap }}
        checksum/config-overlay: {{ .Values.config.overlay | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vpay.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "vpay.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          # The SAME image the server Deployment runs. There were two images,
          # `vpay-server` and `vpay-worker`, until 2026-09-07 (issue #77);
          # `images.worker` is gone from values.yaml and values.schema.json
          # with it, so `component "worker"` here would now be a render-time
          # `nil` rather than a wrong-but-plausible reference.
          image: {{ include "vpay.image" (dict "ctx" . "component" "server") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # `args`, NOT `command`. Kubernetes `command` overrides the image's
          # ENTRYPOINT and `args` overrides its CMD, so `command: ["worker"]`
          # would ask the kernel to exec a file called `worker` that is not in
          # this `scratch` image, and the pod would CrashLoopBackOff with
          # `exec: "worker": executable file not found`. `args` appends to
          # `ENTRYPOINT ["/vpay-server"]`, which is what runs the job loop.
          # Compose is the other way round — its `command:` IS the CMD — which
          # is why `compose.e2e.yml` says `command: ["worker"]` and this says
          # `args`.
          args: ["worker"]
          securityContext:
            {{- include "vpay.containerSecurityContext" . | nindent 12 }}
          ports:
            # The worker's only HTTP listener, and its first: block A gave the
            # worker the same `--observability-bind` socket the server has
            # (/livez and /metrics, nothing else). One binary since #77, so
            # they are now the same flag on the same code rather than two
            # copies that happened to agree.
            - name: metrics
              containerPort: {{ .Values.observability.port }}
              protocol: TCP
          env:
            {{- include "vpay.commonEnv" . | nindent 12 }}
            - name: VPAY_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.rails.existingSecret | quote }}
          # No readiness probe: the worker backs no Service, so readiness
          # would gate nothing. Liveness only, on the same observability
          # listener the server probes — `vpay-server`'s `tests/cli.rs`
          # (`worker::the_worker_serves_livez_and_metrics_on_the_observability_port`)
          # proves it answers there.
          livenessProbe:
            httpGet:
              path: {{ .Values.observability.livenessPath }}
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.observability.livenessPath }}
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.config.createOverlayConfigMap }}
          volumeMounts:
            - name: config-overlay
              mountPath: {{ include "vpay.overlayMountPath" . }}
              subPath: {{ include "vpay.overlayFileName" . }}
              readOnly: true
          {{- end }}
      # The signing key is deliberately absent here, and since #77 this is the
      # ONLY thing that keeps it away from the worker. `vpay-server worker`
      # rejects `--oauth-signing-key-file` at parse time, but the flag exists
      # on the binary (it has to: the same binary serves the API), so "the
      # worker cannot be handed the key" is a statement about this volume list
      # and not about the CLI. It issues no token and reads no key; mounting
      # the Secret would widen its blast radius for no capability. See
      # `vpay_config::cli::ServerArgs::oauth_signing_key_file`, which says the
      # same thing from the other side.
      {{- if .Values.config.createOverlayConfigMap }}
      volumes:
        - name: config-overlay
          configMap:
            name: {{ include "vpay.overlayConfigMapName" . }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
