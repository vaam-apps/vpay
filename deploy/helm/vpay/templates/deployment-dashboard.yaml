{{- include "vpay.validate" . -}}
{{- if .Values.dashboard.enabled }}
# vpay's admin frontend — `frontends/apps/dashboard`, published as
# `ghcr.io/vaam-apps/vpay-dashboard` (ADR-0022). Modelled on
# `deployment-checkout.yaml`, which is this chart's precedent for a
# `node:22-alpine` Next standalone server, including verbatim:
#
#   * `runAsNonRoot: true` with NO explicit `runAsUser` — the image declares
#     `USER node` and is `node:22-alpine`, so /etc/passwd exists and the
#     kubelet can resolve the name.
#   * `readOnlyRootFilesystem: true` with a memory-backed `emptyDir` on
#     `/tmp` — Next's standalone server wants `HOME`/`XDG_CACHE_HOME`, which
#     the image points at `/tmp` for exactly this reason.
#   * No `envFrom` for the rails Secret and no signing key. This pod holds
#     no merchant credential, no rail credential and no dashboard token of
#     its own — every `/dash/v1` credential it uses is minted by
#     `-management` (or `-server`, when the surfaces are not split) through
#     the two OAuth legs ADR-0017 describes, and lives only in this
#     process's own session, never in a browser.
#
# **What is observed and what is not.** ADR-0022's Dockerfile-hardening
# commit ran this exact image with `docker run --read-only --tmpfs /tmp
# --user 1000:1000` and recorded it turning Docker-`healthy` on
# `GET /healthz`. **No POD has ever run**: a container under `docker run` is
# not a Kubernetes Pod, and the probes' thresholds and the resource numbers
# below are reasoned from the image and from Kubernetes' documented
# behaviour, exactly like the rest of this chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vpay.fullname" . }}-dashboard
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Fixed at 2, never autoscaled — see `values.yaml`'s `dashboard.replicaCount`.
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vpay.componentLabels" (dict "ctx" . "component" "dashboard") | nindent 8 }}
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vpay.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # NOT `vpay.podSecurityContext`: that helper pins UID/GID 65532,
        # which is `backends/Dockerfile`'s user and is not this image's.
        # `node` is uid 1000 here, the same reasoning `deployment-checkout.yaml`
        # states.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # This process has no drain of its own — it serves session-backed HTML
      # and holds no lease — so it gets the chart's value rather than a
      # longer one, exactly like `-checkout`.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: dashboard
          image: {{ include "vpay.image" (dict "ctx" . "component" "dashboard") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            # This pod's view of `/dash/v1`, server-side only. Defaults to
            # this release's own management Service when the surfaces are
            # split (`management.enabled`), or to the single `-server`
            # Service when they are not — the same object serves `/dash/v1`
            # in that case, exactly as it does today. See
            # `dashboard.apiUrl`'s own comment in values.yaml.
            - name: VPAY_DASH_API
              value: {{ default (printf "http://%s:%d" (ternary (printf "%s-management" (include "vpay.fullname" .)) (include "vpay.fullname" .) .Values.management.enabled) (int .Values.service.port)) .Values.dashboard.apiUrl | quote }}
            - name: VPAY_DASHBOARD_CLIENT_ID
              value: {{ .Values.dashboard.clientId | quote }}
            - name: VPAY_DASHBOARD_REDIRECT_URI
              value: {{ .Values.dashboard.redirectUri | quote }}
            - name: VPAY_DASHBOARD_SCOPE
              value: {{ .Values.dashboard.scope | quote }}
            - name: VPAY_DASHBOARD_PUBLIC_ORIGIN
              value: {{ .Values.dashboard.publicOrigin | quote }}
            {{- with .Values.dashboard.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # `/healthz` — `frontends/apps/dashboard/app/healthz/route.ts`,
          # added alongside this chart's Dockerfile-hardening commit
          # (ADR-0022). Same shape as `-checkout`'s: it answers "Next is
          # serving" and takes no dependency, so a `-management` blip or a
          # rolling `vpay-server` deploy does not take this Deployment's
          # readiness down with it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            # Load-bearing, not hygiene — see `-checkout`'s own comment on
            # this line: `readOnlyRootFilesystem: true` without it is a
            # container that cannot start, because the image points `HOME`
            # and `XDG_CACHE_HOME` at /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vpay.fullname" . }}-dashboard
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.dashboard.service.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.dashboard.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  # No `metrics` port, same reason as `-checkout`'s Service: this app emits
  # none.
  selector:
    {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
{{- end }}
