{{- include "vpay.validate" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vpay.serviceAccountName" . }}
  labels:
    {{- include "vpay.labels" . | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# Neither binary talks to the Kubernetes API. Projecting a token into the pod
# would hand a payment process a cluster credential it has no use for; both
# pod specs set the same field too, because this SA-level setting is only a
# default that a pod spec can override.
automountServiceAccountToken: false
{{- end }}
