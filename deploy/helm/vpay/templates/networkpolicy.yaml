{{- include "vpay.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "vpay.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
# Default-deny for both workloads, with the four flows either binary actually
# needs opened by name: the ingress controller to :8080 (server only),
# Prometheus to the observability port, DNS, Postgres, and outbound HTTPS to
# the rails.
#
# Namespaces are matched on `kubernetes.io/metadata.name`, the label the
# control plane sets on every namespace since 1.21 — not on a label somebody
# has to remember to add.
#
# NOTHING HAS EVER APPLIED THIS. A NetworkPolicy is enforced by the CNI, and
# on a cluster whose CNI ignores them (or on one where it does not) this file
# is equally silent about the difference.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-server
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
    # Metrics and /livez, from the monitoring namespace only. This is the
    # other half of keeping /metrics off the Ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
  egress:
{{ include "vpay.egressRules" . | indent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-worker
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The worker answers no request from anyone but Prometheus.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
  egress:
{{ include "vpay.egressRules" . | indent 4 }}
{{- end }}
