{{- include "vpay.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "vpay.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
# Default-deny for both workloads, with the four flows either binary actually
# needs opened by name: the ingress controller to :8080 (server only),
# Prometheus to the observability port, DNS, Postgres, and outbound HTTPS to
# the rails.
#
# Namespaces are matched on `kubernetes.io/metadata.name`, the label the
# control plane sets on every namespace since 1.21 — not on a label somebody
# has to remember to add.
#
# NOTHING HAS EVER APPLIED THIS. A NetworkPolicy is enforced by the CNI, and
# on a cluster whose CNI ignores them (or on one where it does not) this file
# is equally silent about the difference.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-server
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
    # Metrics and /livez, from the monitoring namespace only. This is the
    # other half of keeping /metrics off the Ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
  egress:
{{ include "vpay.egressRules" . | indent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-worker
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The worker answers no request from anyone but Prometheus.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
  egress:
{{ include "vpay.egressRules" . | indent 4 }}
{{- if $.Values.management.enabled }}
---
# ADR-0022 §5: the management tier admits only the pods
# `networkPolicy.managementIngress.podSelector` names — deliberately NOT the
# ingress controller namespace `-server`'s policy above admits. The ADR
# recommends this API not face the public gateway at all where the operator
# can arrange it; this NetworkPolicy is the concrete version of that
# recommendation this chart can express on its own, and it is what actually
# stops an in-cluster caller from reaching `-management` directly once the
# HTTPRoute's `/dash/v1` rule sends the intended traffic there — an
# HTTPRoute rule says where THIS chart's routing points, not who else in
# the namespace may address the Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-management
  labels:
    {{- include "vpay.componentLabels" (dict "ctx" . "component" "management") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vpay.componentSelectorLabels" (dict "ctx" . "component" "management") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $np.managementIngress.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
  egress:
{{ include "vpay.egressRules" . | indent 4 }}
{{- end }}
{{- end }}
