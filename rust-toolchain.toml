# Pinned so CI and every developer build the same compiler.
#
# NOTE: this repo was authored and verified against stable 1.95.0. The MSRV
# declared in Cargo.toml (`rust-version = "1.88"`) is derived *only* from
# `cargo metadata`'s `rust_version` field across the whole resolved dependency
# graph (the max over every package, including dev-dependencies — currently
# `time` 0.3.47 and `testcontainers`/`testcontainers-modules` 0.27/0.15, all
# of which declare 1.88). It has NOT been verified by actually compiling this
# workspace with a 1.88 toolchain — only stable (1.95.0) was available in the
# authoring environment. A meaningful fraction of the graph (63 of 317
# packages, at last check) declares no `rust_version` at all, so the true
# floor could in principle be higher still. Verify with an actual 1.88
# toolchain before relying on this number, e.g. for a container base image.
#
# The musl target is required by `just build-dist`; add it with
#   rustup target add x86_64-unknown-linux-musl
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
