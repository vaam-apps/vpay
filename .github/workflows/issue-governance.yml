# Validates issue structure against the ai-governance work-item templates.
# Not a PR workflow. The implementation lives in vaam-apps/.github.
name: issue governance

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  structure:
    permissions:
      issues: write
    uses: vaam-apps/.github/.github/workflows/issue-governance.yml@57da4093ecd2c50f1da0a98fe88c6e3229c91547 # vaam-apps/.github main
    with:
      enforce: true
    secrets:
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
