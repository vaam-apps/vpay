name: ci

on:
  # The default branch is `master` (see `git remote show origin`). This used
  # to say `main`, which meant the workflow never ran on a merge — only on
  # pull requests — and nothing ever verified what actually landed.
  push: { branches: [master] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # NOT set here: `CYPRESS_INSTALL_BINARY`. It used to be `0` at workflow
  # level, which also applied to the `e2e` job below — whose whole point is
  # to run Cypress. Once `bf9811d` fixed the `pnpm/action-setup` failure
  # that had stopped every earlier run before this point, that single line
  # is what failed the two runs after it ("Command 'cypress' not found").
  # The jobs that do not need the binary opt out individually instead.

jobs:
  # The promises this repo makes about itself. Fast, and first — if these
  # fail, nothing else is worth running.
  verify:
    # The job's display name is what branch protection pins as a required
    # check, so it stays exactly as it was; the new check is named in its
    # own step instead.
    name: self-checks (no-mocks, status)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the compiler version: `rust-toolchain.toml`.
      # `dtolnay/rust-toolchain@stable` would install *today's* stable and let
      # rustup silently download the pinned one on the first `cargo` call —
      # or, on a rustup with auto-install disabled, fail. Reading the pin
      # here keeps CI, developers and `backends/Dockerfile` on one number.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify-no-mocks
      - run: cargo xtask verify-status
      - name: verify-errors (ADR-0011)
        run: cargo xtask verify-errors

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # `backends/tests/integration/tests/webhooks.rs` verifies a
      # `Vpay-Signature` this server emitted with the SHIPPING Node SDK, in a
      # subprocess. That test fails rather than skips when `node` is missing,
      # and this flag only changes the message — a skipped parity test is a
      # parity claim nobody checked, which is how this suite would go green
      # while proving nothing (CLAUDE.md's first failure mode). The Node
      # toolchain and the SDK build are set up below.
      VPAY_REQUIRE_NODE: 1
      # The `rust` job runs no Cypress; skip the ~200 MB binary download that
      # `pnpm install` would otherwise trigger.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          # Block style on purpose. The previous flow-style
          # `{ components: rustfmt, clippy }` parsed `clippy` as a *second
          # key* with no value — GitHub annotated every run with
          # "Unexpected input(s) 'clippy'" and clippy only worked because the
          # runner image happens to preinstall it.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Comma-separated in one string; a flow-style `{ tool: nextest, just }`
          # would repeat the `components:` mistake noted above.
          tool: nextest,just
      # Node, and the built `@vpay/sdk`, for the webhook signature-parity
      # test. Before nextest on purpose: the test builds `dist/` on demand if
      # it is absent, and a build failure should be reported by the step
      # whose job it is rather than as a mysterious test failure.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vpay/sdk build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs the container-backed suites too (vpay-db, vpay-tests-integration,
      # both binaries' tests/cli.rs) — ubuntu-latest has a working Docker
      # daemon and testcontainers fails hard without one, so these cannot
      # silently skip. This job is the evidence for those suites; see
      # docs/status.md, "Last verified".
      - run: cargo nextest run --workspace
      # A new `#[ignore]` must not quietly shrink coverage, and a whole test
      # binary dropping out of the workspace must not read as "fewer tests,
      # still green". The recipe pins both numbers; bump them in the same
      # commit that legitimately changes them.
      - run: just verify-ignored

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      # This job never runs Cypress; skip the ~200 MB binary download.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 refuses to run
      # when both it and package.json's `packageManager` name a version
      # ("Multiple versions of pnpm specified"). package.json is the single
      # source of truth (pnpm@9.15.0). This was the workflow's first-ever
      # run and it failed on exactly that, 2026-09-02.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # The Node SDK is the one package whose `build` actually emits JS
      # (`dist/`, consumed by merchants and by `just sdk-conformance-node`);
      # `pnpm -r typecheck` alone would not catch an emit-time failure.
      - run: pnpm --filter @vpay/sdk build
      - run: pnpm --filter @vpay/ui build-storybook

  e2e:
    name: e2e (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The Cypress binary lives outside node_modules (~/.cache/Cypress) and
      # is not covered by setup-node's pnpm-store cache.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # With `CYPRESS_INSTALL_BINARY` unset, the `cypress` package's own
      # postinstall downloads the binary during `pnpm install`. `verify` then
      # proves it is actually runnable before a stack is built for it.
      - run: pnpm install --frozen-lockfile
      # Kept even though `pnpm install` normally downloads the binary: the
      # `web` job shares this runner's pnpm store (same `cache: pnpm` key)
      # with `CYPRESS_INSTALL_BINARY: 0`, and pnpm's side-effects cache can
      # then let a later install skip cypress's postinstall entirely. This
      # step is idempotent — a no-op when the binary is already there.
      - run: pnpm --filter @vpay/e2e exec cypress install
      - run: pnpm --filter @vpay/e2e exec cypress verify
      # A throwaway RS256 signing key for the merchant OP: `vpay-server` will
      # not start without one (compose.e2e.yml explains the mount). Generated
      # per run, world-readable so UID 65532 inside the scratch image can
      # read the bind mount, discarded with the runner.
      - name: generate a throwaway OAuth signing key for the stack
        run: just gen-e2e-signing-key
      - name: build both images and bring up the real stack (rails stubbed by WireMock, not in-process)
        run: docker compose -f compose.yml -f compose.e2e.yml up -d --build
      # `vpay-server`'s image is `FROM scratch` and carries no HEALTHCHECK
      # (see compose.e2e.yml for why), so readiness is observed from the
      # runner instead. This is also the first place in this repository's
      # history that proves the image boots at all: a 200 here means the
      # binary started, found its config, connected to Postgres and ran
      # the migrations — /healthz is a real `SELECT 1`, not a static "ok".
      - name: wait for vpay-server to answer 200 on /healthz
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then
              echo "vpay-server: /healthz answered 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::vpay-server never answered 200 on /healthz (last status: '$code')"
          docker compose -f compose.yml -f compose.e2e.yml ps
          docker compose -f compose.yml -f compose.e2e.yml logs --no-color vpay-server
          exit 1
      - name: wait for the dashboard to answer on :3000
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "dashboard: / answered 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dashboard never answered 200 on / (last status: '$code')"
          docker compose -f compose.yml -f compose.e2e.yml logs --no-color dashboard
          exit 1
      - run: pnpm --filter @vpay/e2e e2e
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml down -v
