name: ci

on:
  # The default branch is `master` (see `git remote show origin`). This used
  # to say `main`, which meant the workflow never ran on a merge — only on
  # pull requests — and nothing ever verified what actually landed.
  push: { branches: [master] }
  pull_request:

# The floor for every job below, and no job overrides it: nothing in this
# workflow writes anything back to GitHub. It checks out, compiles, runs
# tests, brings a compose stack up and renders a chart. Without this block
# the default token is whatever the repository setting says — historically
# read/write — so a compromised action in any of these six jobs could push
# a commit or a package (CodeQL actions/missing-workflow-permissions).
#
# `actions/upload-artifact@v4` in `e2e` does not need `actions: write`: it
# uploads through the runtime token the runner injects, not `GITHUB_TOKEN`.
# `release.yml` is the only workflow here that writes, and it scopes its
# own permissions per job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOT set here: `CYPRESS_INSTALL_BINARY`. It used to be `0` at workflow
  # level, which also applied to the `e2e` job below — whose whole point is
  # to run Cypress. Once `bf9811d` fixed the `pnpm/action-setup` failure
  # that had stopped every earlier run before this point, that single line
  # is what failed the two runs after it ("Command 'cypress' not found").
  # The jobs that do not need the binary opt out individually instead.

jobs:
  # The promises this repo makes about itself. Fast, and first — if these
  # fail, nothing else is worth running.
  verify:
    # The job's display name is what branch protection pins as a required
    # check, so it stays exactly as it was; the new check is named in its
    # own step instead.
    name: self-checks (no-mocks, status)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the compiler version: `rust-toolchain.toml`.
      # `dtolnay/rust-toolchain@stable` would install *today's* stable and let
      # rustup silently download the pinned one on the first `cargo` call —
      # or, on a rustup with auto-install disabled, fail. Reading the pin
      # here keeps CI, developers and `backends/Dockerfile` on one number.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify-no-mocks
      - run: cargo xtask verify-status
      - name: verify-errors (ADR-0011)
        run: cargo xtask verify-errors

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      # `backends/tests/integration/tests/webhooks.rs` verifies a
      # `Vpay-Signature` this server emitted with the SHIPPING Node SDK, in a
      # subprocess. That test fails rather than skips when `node` is missing,
      # and this flag only changes the message — a skipped parity test is a
      # parity claim nobody checked, which is how this suite would go green
      # while proving nothing (CLAUDE.md's first failure mode). The Node
      # toolchain and the SDK build are set up below.
      VPAY_REQUIRE_NODE: 1
      # The `rust` job runs no Cypress; skip the ~200 MB binary download that
      # `pnpm install` would otherwise trigger.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          # Block style on purpose. The previous flow-style
          # `{ components: rustfmt, clippy }` parsed `clippy` as a *second
          # key* with no value — GitHub annotated every run with
          # "Unexpected input(s) 'clippy'" and clippy only worked because the
          # runner image happens to preinstall it.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Comma-separated in one string; a flow-style `{ tool: nextest, just }`
          # would repeat the `components:` mistake noted above.
          tool: nextest,just
      # Node, and the built `@vpay/sdk`, for the webhook signature-parity
      # test. Before nextest on purpose: the test builds `dist/` on demand if
      # it is absent, and a build failure should be reported by the step
      # whose job it is rather than as a mysterious test failure.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vpay/sdk build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs the container-backed suites too (vpay-db, vpay-tests-integration,
      # both binaries' tests/cli.rs) — ubuntu-latest has a working Docker
      # daemon and testcontainers fails hard without one, so these cannot
      # silently skip. This job is the evidence for those suites; see
      # docs/status.md, "Last verified".
      - run: cargo nextest run --workspace
      # A new `#[ignore]` must not quietly shrink coverage, and a whole test
      # binary dropping out of the workspace must not read as "fewer tests,
      # still green". The recipe pins both numbers; bump them in the same
      # commit that legitimately changes them.
      - run: just verify-ignored

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of `master` (the ref the `toolchain:` input is
      # documented for) rather than the mutable branch, for the same reason
      # `cargo deny` runs at all. Bump deliberately.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      # This job never runs Cypress; skip the ~200 MB binary download.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 refuses to run
      # when both it and package.json's `packageManager` name a version
      # ("Multiple versions of pnpm specified"). package.json is the single
      # source of truth (pnpm@9.15.0). This was the workflow's first-ever
      # run and it failed on exactly that, 2026-09-02.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # For `just audit-web` below. Pinned to a full commit SHA rather than
      # the `@v2` the `rust` and `e2e` jobs use — matching what `deploy`
      # does, and for the reason stated there: a mutable tag is a promise
      # from whoever can move it, and this is the step that decides whether
      # a known-vulnerable dependency can land.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      # Immediately after install and before anything is built, so a
      # known-vulnerable dependency fails this job in seconds rather than
      # after a Storybook build. `just audit-web`, not a copy of its
      # commands: the recipe is what a contributor runs locally, and the
      # justfile carries the reasoning (two runs, `--audit-level=high`, and
      # why dev dependencies are gated too — every JS advisory this repo has
      # had was in dev tooling). `pnpm audit` resolves from `pnpm-lock.yaml`,
      # which the step above has just proved is current, so this gates what
      # would actually be installed rather than what happens to be on disk.
      #
      # Only this job runs it: `e2e` installs from the same lockfile, and
      # auditing it twice per pull request buys nothing.
      - name: audit-web (pnpm audit; high and critical fail)
        run: just audit-web
      # Before `typecheck`, not after it. The Node SDK is the one package
      # whose `build` actually emits JS (`dist/`, consumed by merchants and by
      # `just sdk-conformance-node`), so `pnpm -r typecheck` alone would not
      # catch an emit-time failure — but it is also a *prerequisite* of the
      # typecheck now: `sdks/stripe-compat` imports `@vpay/sdk/stripe`, whose
      # types resolve through the package's `exports` to `dist/stripe-auth.d.ts`,
      # and `dist/` is gitignored. Run in the old order this job failed on a
      # clean checkout with `TS2307: Cannot find module '@vpay/sdk/stripe'`.
      # The `e2e` job builds it for the same reason; neither job can borrow
      # the other's artefacts.
      - run: pnpm --filter @vpay/sdk build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @vpay/ui build-storybook

  e2e:
    name: e2e (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The Cypress binary lives outside node_modules (~/.cache/Cypress) and
      # is not covered by setup-node's pnpm-store cache.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # A Rust toolchain in the *e2e* job, which never used to need one.
      # `just gen-demo-keys` (below) runs `cargo xtask gen-signing-key`,
      # because generating the demo merchant's key pair also means extracting
      # its public JWK and its RFC 7638 thumbprint — and reproducing a
      # thumbprint in shell would be a second implementation of it. `xtask`
      # depends on five small crates and none of the workspace, so this is a
      # short compile, not a build of the server.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      # With `CYPRESS_INSTALL_BINARY` unset, the `cypress` package's own
      # postinstall downloads the binary during `pnpm install`. `verify` then
      # proves it is actually runnable before a stack is built for it.
      - run: pnpm install --frozen-lockfile
      # Kept even though `pnpm install` normally downloads the binary: the
      # `web` job shares this runner's pnpm store (same `cache: pnpm` key)
      # with `CYPRESS_INSTALL_BINARY: 0`, and pnpm's side-effects cache can
      # then let a later install skip cypress's postinstall entirely. This
      # step is idempotent — a no-op when the binary is already there.
      - run: pnpm --filter @vpay/e2e exec cypress install
      # `cypress verify` runs the Electron binary's smoke test with a 30 s
      # default budget. On a cold runner Cypress 15's binary has exceeded it
      # (master run 33789060261 after PR #23, minutes after the same step passed
      # on the PR) while the specs themselves are unaffected, so the budget is
      # raised: a genuinely broken binary still fails, just later.
      - run: pnpm --filter @vpay/e2e exec cypress verify
        env:
          CYPRESS_VERIFY_TIMEOUT: "120000"
      # The Node SDK's `dist/` — `sdks/stripe-compat` imports
      # `@vpay/sdk/stripe`, which resolves to `dist/stripe-auth.js`. The `web`
      # job builds it too; this job cannot borrow that job's artefacts.
      - run: pnpm --filter @vpay/sdk build
      # `@vpay/stripe-js`'s built ESM, vendored into
      # `examples/checkout-browser/dist/stripe-js/` — what `checkout.js`
      # imports and what `checkout.cy.ts` (below) actually drives in a real
      # browser. Both this build and `mint.mjs`'s `@vpay/sdk` dependency need
      # `pnpm install` above; `@vpay/sdk`'s own `dist/` was just built by the
      # step above this one, and pnpm's workspace symlink resolves
      # `examples/checkout-browser`'s dependency to it directly.
      - run: just build-checkout-browser
      # Two throwaway RS256 key pairs, not one. `gen-demo-keys` depends on
      # `gen-e2e-signing-key`, so it still produces the merchant OP's own
      # signing key (`vpay-server` will not start without it —
      # compose.e2e.yml explains the mount); it *also* produces a registered
      # merchant's key pair plus the `demo` profile overlay carrying its
      # public JWK.
      #
      # That second pair is why this job now brings up `-f compose.demo.yml`
      # as well. `config/application.yml`'s only merchant, `acme-cameroon`,
      # has a placeholder modulus that nobody holds the private half of, so
      # against the base file alone no client can complete the
      # `private_key_jwt` handshake and `sdks/stripe-compat` could not make a
      # single authenticated `/v1` call. The overlay replaces the merchant
      # registry with one entry whose key this runner generated moments ago.
      #
      # Everything else the demo overlay changes is inert here: it stops
      # publishing Postgres on the host (nothing in this job connects to it
      # from outside a container) and it republishes `vpay-server` through
      # `${VPAY_DEMO_PORT:-8080}`, which with the variable unset is the same
      # `8080:8080` this job already polled.
      #
      # The one change that is NOT merely a port is the config overlay:
      # compose.e2e.yml sets `VPAY_PROFILE: sandbox`, compose.demo.yml
      # overrides it to `demo`, and vpay-config loads ONE overlay — the one
      # the profile names. So this stack loads `config/application-demo.yml`
      # *instead of* `config/application-sandbox.yml`, and with that,
      # `application-sandbox.yml` is exercised by nothing in this workflow
      # even though `sandbox` is the CLI's default profile.
      #
      # That is currently inert, and only currently. The sandbox overlay sets
      # exactly two things the demo overlay does not: `deployment.name`
      # (cosmetic) and `dashboard_client.redirect_uris`, which points the OIDC
      # callback at `http://localhost:3000/dash/v1/callback`. The Cypress spec
      # asserts the dashboard's scaffold notice and never starts a login, so
      # no redirect URI is read on either profile. The day a spec signs in,
      # this job stops covering the profile it thinks it covers — see
      # docs/status.md's "GitHub Actions" row.
      - name: generate throwaway OAuth keys — the OP's, and a registered merchant's
        run: just gen-demo-keys
      - name: build both images and bring up the real stack (rails stubbed by WireMock, not in-process)
        run: docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml up -d --build
      # `vpay-server`'s image is `FROM scratch` and carries no HEALTHCHECK
      # (see compose.e2e.yml for why), so readiness is observed from the
      # runner instead. This is also the first place in this repository's
      # history that proves the image boots at all: a 200 here means the
      # binary started, found its config, connected to Postgres and ran
      # the migrations — /healthz is a real `SELECT 1`, not a static "ok".
      - name: wait for vpay-server to answer 200 on /healthz
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then
              echo "vpay-server: /healthz answered 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::vpay-server never answered 200 on /healthz (last status: '$code')"
          docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml ps
          docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml logs --no-color vpay-server
          exit 1
      - name: wait for the dashboard to answer on :3000
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "dashboard: / answered 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dashboard never answered 200 on / (last status: '$code')"
          docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml logs --no-color dashboard
          exit 1
      # VPAY_BASE_URL/VPAY_MERCHANT_CLIENT_ID/VPAY_MERCHANT_PRIVATE_KEY_PATH
      # are read by `checkout.cy.ts`'s `cy.task('mintCheckoutPaymentIntent')`
      # (`frontends/tests/e2e/cypress/tasks/checkoutTasks.ts`) to mint a real
      # PaymentIntent through `@vpay/sdk` before the spec visits the page —
      # the same three variables the "stripe-node conformance" step below
      # sets for the same demo-merchant keypair. 8080, not 18080: this job
      # never sets VPAY_DEMO_PORT, so compose.demo.yml's default stands (see
      # that file's own comment on why 8080 here is not a coincidence).
      - run: pnpm --filter @vpay/e2e e2e
        env:
          VPAY_BASE_URL: http://localhost:8080
          VPAY_MERCHANT_CLIENT_ID: demo-merchant
          VPAY_MERCHANT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.e2e/demo-merchant/oauth-signing-key.pem
      # The official `stripe` package, driven against this same running stack
      # through `createStripeAuthenticator` (docs/flows/stripe-sdk-compat.md).
      # Out of process on purpose: half of what it proves is header behaviour
      # through the real router, which an in-process harness cannot see.
      #
      # It has no `test` script and so is NOT part of the `web` job's
      # `pnpm -r test` — the same arrangement `@vpay/e2e` uses, and for the
      # same reason: a suite that needs a stack must not be able to report
      # green in a job that has none. It does not skip when the stack is
      # absent either; its `globalSetup` fails the run.
      - name: stripe-node conformance against the running stack
        env:
          VPAY_BASE_URL: http://localhost:8080
          # The merchant webhook receiver, as compose.demo.yml publishes it
          # with VPAY_DEMO_RECEIVER_PORT unset. `webhooks.compat.test.ts`
          # reads its request journal — the merchant-side view of a delivery —
          # and hands the recorded body and Stripe-Signature to the real
          # `stripe` package's `constructEvent`.
          VPAY_RECEIVER_URL: http://localhost:8083
          VPAY_MERCHANT_CLIENT_ID: demo-merchant
          # Absolute: `pnpm --filter` runs the script with the cwd set to the
          # package, not to the checkout, so a relative path here would be
          # resolved against `sdks/stripe-compat/`.
          VPAY_MERCHANT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.e2e/demo-merchant/oauth-signing-key.pem
        run: pnpm --filter @vpay/stripe-compat compat
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml down -v

  # The Helm chart. Renders it, proves every template guard fires, and
  # validates every rendered object against upstream schemas.
  #
  # It never touches a cluster — there is none to touch — so what this job
  # establishes is narrow and worth stating: the chart is syntactically valid,
  # its two value sets render, each named `fail` guard aborts on its own
  # values file, the ingress rate limit ADR-0009 assumes is present in the
  # rendered YAML, and every object matches its Kubernetes (or Prometheus CRD)
  # schema. It establishes nothing about scheduling, probes,
  # readOnlyRootFilesystem, the NetworkPolicy, or whether an ingress
  # controller honours `limit-rps`. See docs/status.md.
  #
  # No Rust toolchain: this job compiles nothing and adds no test binary, so
  # `justfile`'s `expected_suites` / `min_tests` are untouched by it.
  deploy:
    name: deploy (helm chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Third-party actions in this job are pinned to a full commit SHA, the
      # way `release.yml` pins every one of its own: a mutable tag like `@v4`
      # is a promise from whoever can move it, and this job is the only gate
      # on the chart. `actions/*` stays on its tag to match the rest of this
      # file — one convention per file, and GitHub owns that namespace.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.1
      # No action for kubeconform; the release tarball is one binary. Pinned
      # by version AND by digest: a version tag on a GitHub release names a
      # file that can be replaced in place, so the checksum is what actually
      # decides what runs here. It is the one upstream publishes in the
      # release's own CHECKSUMS asset.
      - name: install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      # One recipe, not a copy of its steps: `just helm-check` is what a
      # contributor runs locally, so the gate and the local check cannot
      # drift. It is deliberately NOT part of `just ci` — kubeconform fetches
      # its schemas over the network, and `just ci` must work offline.
      #
      # The recipe does all four things this job exists for: `helm lint` and
      # `helm template` over the default values and over
      # `deploy/helm/vpay/ci/values-full.yaml` (which turns on every optional
      # object so kubeconform actually sees them); one `helm template` per
      # file in `deploy/helm/vpay/ci/guards/`, each of which must exit
      # non-zero with a message naming the guard the file is called after;
      # a grep for `nginx.ingress.kubernetes.io/limit-rps` on the rendered
      # Ingress plus a check that the token endpoint's limit is the tighter
      # of the two; and `kubeconform -strict -summary` with
      # `-schema-location default` for the built-in kinds and the
      # datreeio/CRDs-catalog location for ServiceMonitor and PrometheusRule,
      # which no built-in schema covers.
      - run: just helm-check
