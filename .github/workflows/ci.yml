name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CYPRESS_INSTALL_BINARY: 0

jobs:
  # The two promises this repo makes about itself. Fast, and first — if these
  # fail, nothing else is worth running.
  verify:
    name: self-checks (no-mocks, status)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify-no-mocks
      - run: cargo xtask verify-status

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # Surfaces how much is NOT covered. Informational, never blocking.
      - name: report ignored tests
        run: cargo nextest list --workspace --run-ignored ignored-only || true

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # The Node SDK is the one package whose `build` actually emits JS
      # (`dist/`, consumed by merchants and by `just sdk-conformance-node`);
      # `pnpm -r typecheck` alone would not catch an emit-time failure.
      - run: pnpm --filter @vpay/sdk build
      - run: pnpm --filter @vpay/ui build-storybook

  e2e:
    name: e2e (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cypress install
      - name: bring up the real stack (rails stubbed by WireMock, not in-process)
        run: docker compose -f compose.yml -f compose.e2e.yml up -d --build
      - run: pnpm --filter @vpay/e2e e2e
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
      - if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml down -v
