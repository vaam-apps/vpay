# Calls the org-wide quality workflows in vaam-apps/.github.
#
# The implementations live in one place; what this file owns is the answer to
# "has anything meaningful changed", which is necessarily per-repo.
#
# Gating is a per-job `if:` over a paths-filter job, never `on.pull_request.paths`.
# A skipped job still reports and satisfies a required status check; a workflow
# that never triggers reports nothing and blocks the PR forever on a check that
# will never arrive.
name: quality

on:
  pull_request:
    branches: [master]
  # The default branch has otherwise never been security-scanned: a fork PR
  # gets no secrets (app-client-id/app-private-key), so CodeQL/Trivy silently
  # never run for it, and nothing else scans the default branch once a fork
  # PR merges. This closes that gap by scanning on every push to the default
  # branch too.
  push:
    branches: [master]

permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  # PR-only: on the default branch the group key is identical for every
  # merge, so cancelling would let one merge abort the scan still verifying
  # the merge before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      iac: ${{ steps.filter.outputs.iac }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Positive lists, never '**' plus '!' exclusions: paths-filter ORs
            # its rules through picomatch, so '**' matches everything and the
            # negations never subtract.
            code:
              - 'backends/**'
              - 'frontends/**'
              - 'sdks/**'
              - 'crates/**'
              - '.xtask/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/package.json'
            docs:
              - '**/*.md'
              - '**/*.adoc'
              - 'docs/**'
            iac:
              - '**/Dockerfile*'
              - 'compose*.yaml'
              - 'compose*.yml'
              - 'deploy/**'
              - 'charts/**'
              - 'helm/**'
              - '.github/workflows/**'
            any:
              - '**'

  sast:
    name: SAST
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: vaam-apps/.github/.github/workflows/sast.yml@01d7a15ee827152447d3b3b7031fdc8a02d98dd7 # vaam-apps/.github main
    with:
      codeql-languages: ${{ needs.changes.outputs.code == 'true' && '["rust","javascript-typescript","actions"]' || '[]' }}
      docs-globs: ${{ needs.changes.outputs.docs == 'true' && '**/*.md' || '' }}
      fail-on-broken-links: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  lint:
    name: lint
    needs: changes
    # PR-only: its `fix` input defaults to true, and on a push
    # github.event.pull_request.head.repo.full_name is empty, so the
    # reusable workflow's own "commit fixes onto the PR branch" step runs
    # `git checkout -q -B superlinter-fixes ""` and fails. Linting is a
    # PR-time concern anyway; the scanners are what need default-branch
    # coverage.
    if: github.event_name == 'pull_request' && needs.changes.outputs.any == 'true'
    permissions:
      contents: read
      statuses: write
    uses: vaam-apps/.github/.github/workflows/lint.yml@01d7a15ee827152447d3b3b7031fdc8a02d98dd7 # vaam-apps/.github main
    with:
      # One anchored alternation, one arm per exclusion, each with its reason.
      # Super-linter matches this against the path it prints in its own log,
      # which is ABSOLUTE (`/github/workspace/docs/sdks/parity.md`) — hence
      # every arm starts `(^|/)` rather than `^`, which would never match.
      # Nothing else is excluded: a rule that is wrong for one file is not a
      # reason to turn it off for the tree.
      #
      # 1. `AGENTS.md` / `CLAUDE.md` — agent instructions, not prose for
      #    people. They are written to be read by a machine that does not
      #    care about MD013 or heading style, and `FIX_MARKDOWN` reflowing
      #    them would change instructions nobody reviewed.
      # 2. `sdks/tauri/*/permissions/{autogenerated,schemas}/` — written by
      #    `tauri_plugin::Builder` in the plugin's `build.rs` on EVERY
      #    `cargo build`, and tracked on purpose (a consuming app's build
      #    script reads them). `reference.md` is inline `<table>` HTML with
      #    no top-level heading, so it fails MD041, MD001 and ~30 MD033;
      #    hand-fixing it is undone by the next build, which then leaves a
      #    dirty tree. `.prettierignore` excludes these two directories for
      #    exactly this reason and says so at length.
      # 3. `tsconfig*.json` — TypeScript's own config format permits
      #    comments, and this repository's tsconfigs carry load-bearing
      #    explanatory ones (`sdks/stripe-js`, `sdks/nodejs`,
      #    `examples/tauri-checkout`). Super-linter's JSON validator applies
      #    `jsonc/no-comments` and calls each one an error. `tsc` is the real
      #    validator of these files and it is already run by the `web` job.
      # 4. `.agents/skills/` — vendored agent skills, installed by
      #    `npx skills add` from their upstream repositories and pinned by a
      #    per-skill `computedHash` in `skills-lock.json` over their exact
      #    bytes. `.prettierignore` already excludes this directory for that
      #    reason: a reformatted copy no longer matches its lock entry, and
      #    the next install puts the upstream bytes back. Found on the
      #    `@vaam-apps/ui` 0.3.0 bump (2026-09-24), the first change to
      #    replace a whole vendored skill since this gate existed: master's
      #    `vaam-ui` copy had been prettier-aligned by hand (#157), the
      #    upstream bytes are not, and this org's markdownlint config
      #    (`MD060: aligned`) reports 221 unaligned table pipes across four
      #    of its files — measured with markdownlint-cli2 0.23.3 and that
      #    config, and `--fix` does not fix MD060, so `FIX_MARKDOWN` would
      #    not have repaired it either. The count is CI's, not only a local
      #    one: upstream's own super-linter failed vaam-apps/ui#24 on 120
      #    MD060 in `data-display.md` — the same file, the same 120 — and
      #    that pull request merged with the check red. Formatting a skill
      #    is its upstream's business; this repository vendors the bytes.
      filter-regex-exclude: '(^|/)(AGENTS|CLAUDE)\.md$|(^|/)sdks/tauri/[^/]+/permissions/(autogenerated|schemas)/|(^|/)tsconfig[^/]*\.json$|(^|/)\.agents/skills/'
    secrets:
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  trivy:
    name: trivy
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.iac == 'true'
    permissions:
      security-events: write
      contents: read
    uses: vaam-apps/.github/.github/workflows/trivy.yml@01d7a15ee827152447d3b3b7031fdc8a02d98dd7 # vaam-apps/.github main
    with:
      scanners: "vuln,secret,misconfig"
      upload-sarif: true
    secrets:
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
