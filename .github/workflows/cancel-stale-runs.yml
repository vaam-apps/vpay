# Cancels what is still running for a branch once its pull request is closed or merged, or once the
# branch itself is deleted. Owner, 2026-11-27: "add a line in all PR that cancels all running
# workflows when a newer job lands, or when the PR get merged, or when the branch is deleted".
# The first part (a newer push) is each workflow's own `concurrency` block; this file is the other two.
#
# It only cancels runs of the branch, never the default branch, and never its own run. A pull
# request from a fork gets a read-only token: the cancel then fails and is reported as a warning.
name: cancel-stale-runs

on:
  pull_request:
    types: [closed]
  delete:

permissions: {}

jobs:
  cancel:
    # `delete` fires for tags too; only a deleted branch is ours.
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the branch's queued and running workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELF: ${{ github.run_id }}
        run: |
          set -u
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::notice::Nothing to cancel: branch '$BRANCH' is empty or the default branch."
            exit 0
          fi
          for status in queued in_progress waiting pending requested; do
            ids=$(gh run list -R "$REPO" --branch "$BRANCH" --status "$status" --limit 100 \
              --json databaseId --jq '.[].databaseId') || {
              echo "::warning::Could not list '$status' runs of '$BRANCH'."
              continue
            }
            for id in $ids; do
              [ "$id" = "$SELF" ] && continue
              gh run cancel -R "$REPO" "$id" || echo "::warning::Could not cancel run $id."
            done
          done
          exit 0
