non_db_surfaces:
  - id: logs
    surface: telemetry
    description: stdout/stderr tracing fields (tracing-subscriber)
    enumerable: false
    unmet: no static scanner over tracing!() sites yet; the Debug-redaction rule and CustomerRow hand-written impls are the only guard
  - id: metrics
    surface: telemetry
    description: /metrics Prometheus text on the observability listener
    enumerable: false
    unmet: metric label derivation is not centrally registered
  - id: traces
    surface: telemetry
    description: "OTLP traces — deliberately absent (docs/status.md: deferred)"
    enumerable: true
    unmet: ""
  - id: event_store
    surface: webhook
    description: events.data — complete rendered API object stored per event (redacted on customer erasure)
    enumerable: true
    unmet: ""
  - id: webhook_payload
    surface: webhook
    description: signed payload delivered to the merchant endpoint
    enumerable: false
    unmet: per-event projections (RFC-0002 D2) not yet implemented; payload == API object today
  - id: browser_storage
    surface: browser
    description: checkout page local memory (frontends/apps/checkout/src/lib/memory-idb.ts) on the payer's own device
    enumerable: true
    unmet: ""
  - id: provider_rail
    surface: provider
    description: what vpay sends to MTN/Orange (payer MSISDN in requesttopay; refund destination)
    enumerable: false
    unmet: no static scan of adapter request builders; guarded by RefundTarget redacting Debug
  - id: merchant_api
    surface: merchant
    description: what /v1 renders to the merchant
    enumerable: false
    unmet: wire object projections are per-resource, not centrally registered
  - id: observability
    surface: observability
    description: /livez and /metrics on --observability-bind
    enumerable: true
    unmet: ""
  - id: backup
    surface: backup
    description: PITR/WAL and full backups (ADR-0013) — external store vpay does not operate
    enumerable: false
    unmet: retention/erasure of restore copies is a deployment obligation (RFC-0002 D13)
