name: vpay_checkout_flutter_example
description: >-
  A runnable app for vpay_checkout_flutter, pointed at compose.demo.yml
  (docs/plans/2026-09-13-flutter-plugin-brief.md, Lane A). Not a store
  submission — see the package README's App Store / Play policy section
  before shipping anything built from this.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  vpay_checkout_flutter:
    path: ../
  # The example calls its OWN backend (`examples/shop`) for a session, the
  # way a real merchant app would — so it needs an HTTP client of its own.
  # `vpay_checkout_flutter` uses http too, but depending on it transitively
  # would be depending on someone else's dependency.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
