name: vpay_checkout_flutter
description: >-
  A payer-facing checkout surface for vpay: opens the hosted checkout page in a
  native window and reports a typed result once a payment intent actually
  settles. Not a way to unlock in-app content — see the README's App Store /
  Play Store section before using externalBrowser mode.
version: 0.1.1
homepage: https://github.com/vaam-apps/vpay
repository: https://github.com/vaam-apps/vpay
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.0
  web: ^1.0.0
  shared_preferences: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^29.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.vpay.checkout_flutter
        pluginClass: VpayCheckoutFlutterPlugin
        dartPluginClass: MethodChannelVpayCheckoutPlatform
        dartFileName: src/platform/method_channel_checkout_platform.dart
      ios:
        pluginClass: VpayCheckoutFlutterPlugin
        dartPluginClass: MethodChannelVpayCheckoutPlatform
        dartFileName: src/platform/method_channel_checkout_platform.dart
      macos:
        pluginClass: VpayCheckoutFlutterPlugin
        dartPluginClass: MethodChannelVpayCheckoutPlatform
        dartFileName: src/platform/method_channel_checkout_platform.dart
      web:
        pluginClass: WebVpayCheckoutPlatform
        fileName: src/platform/web_checkout_platform.dart
