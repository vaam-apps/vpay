# `tauri-plugin-vpay-checkout` — the host half of vpay's Tauri v2 payer
# checkout surface. The contract it implements is
# `docs/plans/2026-09-22-tauri-plugin-brief.md`; the decision it inherits is
# `docs/adr/0021-flutter-checkout-plugin.md`.
#
# This manifest carries its OWN empty `[workspace]` table, and that is
# load-bearing rather than tidy-looking: it makes cargo treat this directory
# as a workspace root of its own, so `tauri`'s dependency graph (wry, tao,
# objc2, and webkit2gtk on Linux) never enters the repository root's
# `Cargo.lock`, `cargo deny`, `cargo xtask verify-no-mocks`'s `cargo metadata`
# sweep, or `just ci`'s `cargo nextest run --workspace`. The root
# `Cargo.toml` is deliberately untouched — see the brief, "Where it lives".
[workspace]

[package]
name = "tauri-plugin-vpay-checkout"
version = "0.6.0" # x-release-please-version
edition = "2024"
# Same floor the rest of the repository declares; the toolchain this crate is
# actually built and verified with is `rust-toolchain.toml`'s 1.98.0, which
# cargo finds by walking up out of this directory.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/vaam-apps/vpay"
authors = ["Vymalo"]
description = "Tauri v2 plugin that opens vpay's hosted checkout in the payer's own browser"
# Not published to crates.io: the merchant-facing artefact is the npm package
# `@vaam-apps/vpay-tauri-checkout`, and the Rust half is consumed by path from
# `examples/tauri-checkout` (and by merchants from a git/path dependency),
# so a crates.io release would be a second, driftable copy of the same wire.
publish = false
# `tauri_plugin::Builder::try_build` refuses to run without `CARGO_MANIFEST_LINKS`
# set (it is how a consuming app's build script discovers this plugin's
# permissions), so the key is mandatory rather than decorative.
links = "tauri-plugin-vpay-checkout"

[lints.rust]
# ADR-0007: no `unsafe` anywhere in this repository's own code. `forbid`, not
# `deny`, so a module cannot opt back in with an `#[allow]`.
unsafe_code = "forbid"

[lints.clippy]
# Mirrors the root workspace's `[workspace.lints.clippy]`. This crate cannot
# inherit it (`lints.workspace = true` needs a parent workspace, and the
# `[workspace]` table above is exactly the thing that severs that link), so
# the house rule from ADR-0007 is restated here rather than silently dropped:
# a panic in a payment path is a defect.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
float_arithmetic = "deny"
dbg_macro = "deny"

[build-dependencies]
# Generates `permissions/autogenerated/`, the permission JSON schema, and the
# `mobile`/`desktop` cfg aliases this crate's `#[cfg]`s rely on.
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
# Caret, not `=`: a Tauri app pins one `tauri` for the whole binary, and an
# exact pin here would make this plugin unusable in any app that is one patch
# ahead. `2.11` is the minor the brief resolved on 2026-09-22 (2.11.6) and the
# floor this crate was compiled against.
tauri = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Desktop only: hands the URL to the platform's default browser. `open` is what
# `tauri-plugin-opener` itself uses, so this adds no new class of dependency to
# a Tauri app that already has the opener plugin.
open = "5"
# URL parsing for the `invalid_url` / `insecure_url` rejections. Refusing a URL
# before it reaches the browser is a D6 requirement, and "does this string
# start with https://" is not a parser.
url = "2"
