[workspace]
resolver = "3"
members = [
    "backends/crates/vpay-config",
    "backends/crates/vpay-core",
    "backends/crates/vpay-db",
    "backends/crates/vpay-ledger",
    "backends/crates/vpay-provider",
    "backends/crates/vpay-adapter-mtn-momo",
    "backends/crates/vpay-adapter-orange-money",
    "backends/crates/vpay-api",
    "backends/crates/vpay-worker",
    "backends/crates/vpay-testkit",
    "backends/apps/vpay-server",
    "backends/apps/vpay-worker-bin",
    "backends/tests/integration",
    "backends/tests/conformance",
    ".xtask",
    "sdks/rust",
    "examples/merchant-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor of the whole resolved dependency graph's own declared `rust-version`
# fields (`cargo metadata` → max over every package's `rust_version`, incl.
# dev-dependencies since `cargo test`/`--all-targets` must build too).
# Currently driven by `time` 0.3.47 and `testcontainers`/`testcontainers-modules`
# 0.27/0.15, all of which declare 1.88. This is metadata-derived only — it has
# not been verified by actually compiling with a 1.88 toolchain; see the note
# in rust-toolchain.toml.
rust-version = "1.88"
license = "Apache-2.0"
# `vaam-apps`, not `vymalo`: the organisation was renamed `vaam-store` ->
# `vaam-apps` on 2026-09-04 and `github.com/vymalo/vpay` now answers a 301 to
# it (verified 2026-09-05). The old URL still resolves through that redirect,
# which is exactly why it survived unnoticed; a `repository` field is read by
# crates.io and by tooling that does not follow redirects, so it names the
# canonical owner. `git remote -v` and the three npm manifests already do.
#
# `authors` and `LICENSE`'s copyright line still say "Vymalo" on purpose:
# those are attribution, not a URL, and changing whom a project is
# copyrighted to is not a rename. Left for the maintainer — see
# `docs/plans/exp7-notes/opus-review.md`.
repository = "https://github.com/vaam-apps/vpay"
authors = ["Vymalo"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# The house rule from docs/adr/0007: a panic in a payment path is a defect.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
float_arithmetic = "deny"     # money is integer minor units, always (docs/flows/money.md)
dbg_macro = "deny"
print_stdout = "warn"

[workspace.dependencies]
# --- async runtime & http ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# `matched-path` is on for exactly one consumer: `vpay_api`'s
# `track_http_metrics` labels `vpay_http_requests_total` with the *route
# pattern* (`/v1/payment_intents/{id}`) rather than the concrete path,
# because a label whose cardinality grows with the number of payment intents
# is a metrics store an attacker — or a busy Tuesday — gets to fill. The
# extension the feature inserts is the only way to learn the pattern from
# middleware. It adds no package: it is an axum-internal feature that makes
# the router put an `Arc<str>` into each request's extensions.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form", "matched-path"] }
tower = "0.5"
# `cors` is Step 5c's addition: the `/v1/browser` nest — and only that
# nest — carries a `CorsLayer`, because a payer's page is served from the
# merchant's own origin and every call it makes to vpay is cross-origin.
# The merchant `/v1` nest deliberately gets none (see `vpay_api::router`).
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit", "cors"] }
hyper = "1"
# `vpay_provider::ProviderAdapter` is an async trait, and a trait with async
# methods is not dyn-safe in Rust 1.95 — the port is held as
# `Box<dyn ProviderAdapter>` by both binaries and by `RouterDeps`, so the
# `async-trait` desugaring (each method returns a boxed future) is what makes
# the port a *port* rather than a generic parameter threaded through every
# call site. Promoted to a workspace pin because three crates now spell it
# (`vpay-provider`, both adapters) on top of the two that already did
# member-level (`vpay-api`, `vpay-db`, both for authkestra's `#[async_trait]`
# stores). Already resolved at 0.1.92 in `Cargo.lock` via authkestra-op and
# vpay-db, so this adds no package to any graph.
async-trait = "0.1"

# --- tls: rustls everywhere, never native-tls (docs/adr/0005) ---
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# 0.13, matching what the pinned authkestra-* crates already depend on — this
# workspace compiled two reqwest majors from the moment `sdks/rust` became the
# first consumer of this pin, for no benefit (`cargo tree -d`).
#
# `rustls-no-provider`, not `rustls`: 0.13's `rustls` feature is
# `__rustls-aws-lc-rs`, i.e. it *selects* the `aws-lc-rs` CryptoProvider, which
# `deny.toml` bans outright (two providers in one process make
# `CryptoProvider::install_default()` panic — docs/adr/0005, docs/adr/0007).
# There is no `ring` flavour in 0.13: reqwest either picks aws-lc-rs for you or
# picks nothing.
#
# Picking nothing has its own hazard, and it is a real one: with
# `rustls-no-provider`, `reqwest::ClientBuilder::build()` **panics** ("No rustls
# crypto provider is configured", `async_impl/client.rs`'s
# `default_rustls_crypto_provider`) unless a process-wide default was installed
# first. A library cannot assume its caller did that, and installing one from a
# library would silently take a decision out of the application's hands. So
# `vpay-sdk` hands reqwest an already-built `rustls::ClientConfig`
# (`ClientBuilder::tls_backend_preconfigured`), which takes the `BuiltRustls`
# branch and never reaches that panic — see `sdks/rust/src/client.rs`'s
# `rustls_client_config`, and the test that builds a client in a fresh process
# with no `install_default()` call anywhere.
#
# Any *other* crate that takes this pin must do the same, or install
# `rustls::crypto::ring::default_provider()` in `main()` before building a
# client. The same prerequisite the authkestra note below records, for the
# same reason.
#
# 0.13 also drops reqwest's own webpki-roots feature in favour of
# `rustls-platform-verifier` (an OS trust store, which a `FROM scratch` image
# does not have — docs/adr/0004). vpay-sdk therefore supplies Mozilla's
# vendored bundle itself, via a direct `webpki-roots` dependency.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2"] }

# --- data ---
# `tls-rustls-ring` (= `tls-rustls-ring-webpki`), which vendors Mozilla's CA
# bundle via `webpki-roots`, rather than `tls-rustls-ring-native-roots`.
# Both keep the single `ring` `CryptoProvider` invariant documented on the
# `authkestra-*` deps below; they differ only in where trusted roots come
# from, and that difference is decisive here.
#
# The runtime image is `FROM scratch` (docs/adr/0004-musl-mimalloc.md — no
# glibc, no shell, no package manager). A scratch image has no OS trust
# store, so `rustls-native-certs` would find nothing at connection time and
# TLS to Postgres would fail *in the shipped image only* — while passing
# locally and in CI, where a trust store exists and the test/compose
# databases speak plain TCP anyway. Vendored roots are the only option that
# works inside scratch.
#
# `webpki-roots` ships under `CDLA-Permissive-2.0`; that is allowed in
# `deny.toml` with its own justification. Note this surfaces only now that a
# non-dev crate depends on `sqlx` (`backends/crates/vpay-db`) — it was
# latent in the workspace's own pins beforehand.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "macros", "migrate",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
rust_decimal = "1"
# Not part of vpay's own `time`-crate convention (docs above/ADR none yet) —
# pulled in solely because `authkestra-op`'s `sqlx` dependency hardcodes the
# `chrono` feature (its own Cargo.toml: `sqlx = { version = "0.8", features =
# ["runtime-tokio", "json", "chrono"] }`, not optional), so every
# `DateTime<Utc>` column SqlxOpStore reads/writes (oauth_codes.expires_at,
# oauth_refresh_tokens.expires_at/revoked_at, oauth_device_codes.expires_at/
# last_polled_at) is chrono-typed, not time-typed, and the acceptance test in
# backends/tests/integration/tests/authkestra_op_smoke.rs has to speak the
# same type to construct an `AuthorizationCode`. Confined to a dev-dependency
# of that one test crate — no shipping crate depends on chrono today.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- serde & config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
figment = { version = "0.10", features = ["yaml", "env"] }
garde = { version = "0.22", features = ["derive"] }
# The WHATWG URL parser, for the boot-time webhook-endpoint checks that
# `validate_host`'s substring rules structurally cannot make: a URL that does
# not parse at all, and one carrying `user:password@` userinfo (which reqwest
# would turn into an `Authorization` header aimed at a merchant's receiver —
# see `vpay_config::config::validate_webhook_endpoints`). Already in the
# resolved graph via reqwest, so naming it here adds no package to any binary;
# the pin exists so a crate that needs the parser spells the same version
# reqwest already resolved.
url = "2"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# The metrics facade and its Prometheus text exporter (step-6 decision (6)).
# `vpay-core::metrics` describes the names; each binary installs one recorder
# and serves `PrometheusHandle::render()` from its own observability listener.
#
# Pinned exactly, the same convention the `authkestra-*` pins below use, and
# for a reason that is specific to this pair rather than stylistic: what makes
# these two safe here is their *transitive graph*, and a patch bump can change
# that graph without changing this line.
#
# `default-features = false` is load-bearing, not tidiness. The exporter's
# default feature set is `["http-listener", "push-gateway"]`, and:
#
#   * `http-listener` pulls `hyper`/`hyper-util` with `server-auto` — a second
#     HTTP server stack in a process that already has axum's. vpay serves
#     `/metrics` itself, from the same axum router that serves `/livez`, so
#     the listener feature buys nothing and costs a duplicate `hyper`
#     (`deny.toml`'s `multiple-versions = "warn"` would say so);
#   * `push-gateway` enables `hyper-rustls/aws-lc-rs`, and `aws-lc-rs` is
#     **banned outright** in `deny.toml` — two rustls `CryptoProvider`s in one
#     binary are what make `install_default()` panic, which is a defect under
#     ADR-0007. So the default feature set is not merely wasteful here, it
#     fails `cargo deny check bans`.
#
# With both off, the exporter's non-optional dependencies are `base64`,
# `evmap`, `indexmap`, `metrics-util`, `quanta` and `thiserror` — no HTTP, no
# TLS, no runtime.
#
# OTLP traces are deliberately NOT here: step-6 decision (6) defers them and
# `docs/status.md` says so, which is why the unused `opentelemetry = "0.27"`
# pin that used to sit on this line is gone rather than kept "for later".
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }

# --- errors ---
thiserror = "2"
anyhow = "1"

# --- cli ---
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# --- auth ---
# Authkestra runs as vpay's own OIDC Provider for /dash/v1 (ADR-0009) and
# verifies merchants' private_key_jwt assertions on /v1 (ADR-0010). Used in
# production code by vpay-db (`SqlClientAssertionStore`) and vpay-api
# (`JwtValidator`), and by the merchant SDK's conformance tests (sdks/rust,
# dev-only). Pinned exactly per Authkestra's own convention (pre-1.0,
# fast-moving; see vsms's Cargo.toml, which hit the same rustls-provider
# collision first) — the whole family must move in lockstep, and every bump
# must re-diff `SqlxOpStore::migrate()` against backends/migrations/0006 +
# 0013 (see those files' headers; 0.5.4 -> 0.7.1 needed 0013).
#
# The collision: vpay pins rustls to the `ring` CryptoProvider (below), but
# every authkestra-* crate defaults to `reqwest`'s `rustls-tls` behaviour via
# its own default feature `rustls-aws-lc-rs`, which pulls in the competing
# `aws-lc-rs` provider. Two providers in one process makes
# `rustls::crypto::CryptoProvider::install_default()` panic if it is ever
# called without one already installed — unacceptable in a payment binary
# (clippy `panic = "deny"`, docs/adr/0007). `default-features = false` +
# `rustls-no-provider` builds every authkestra crate's reqwest client with
# rustls but without selecting a provider, so `ring` (already installed by
# vpay's own rustls/reqwest/sqlx stack) is the only `CryptoProvider` in the
# graph. Verified via `cargo tree -i aws-lc-rs` / `cargo tree -i aws-lc-sys`
# reporting no match — see the auth OP integration spike notes.
#
# REQUIRED FOLLOW-UP, not yet done here: `rustls-no-provider` does not fall
# back to ring silently. reqwest 0.13's own client builder (vendored source,
# reqwest-0.13.4/src/async_impl/client.rs) calls
# `rustls::crypto::CryptoProvider::get_default()` and, finding none, panics
# with "No rustls crypto provider is configured" unless a process-wide
# default was installed first. So whichever vpay binary first constructs an
# authkestra HTTP client (JWKS fetch, engine's own reqwest calls) MUST call
# `rustls::crypto::ring::default_provider().install_default().ok();` — ignore
# the Err, it only means something already installed one — once, in `main()`,
# before that. No shipping binary does this yet — the only call in the
# workspace is test-only, in vpay-api/src/resource_auth.rs's #[cfg(test)]
# module; this is a hard prerequisite for the implementation step, not an
# optional hardening. (sdks/rust sidesteps it entirely by handing reqwest a
# pre-built ring `ClientConfig` — see the reqwest pin's comment above.)
authkestra-op = { version = "=0.7.1", default-features = false, features = ["rustls-no-provider"] }
authkestra-engine = { version = "=0.7.1", default-features = false, features = ["rustls-no-provider", "token", "session"] }
# `op` pulls in authkestra-op + implies `session`/`token`; this is how OP
# routes get mounted onto an axum Router (crates/authkestra-axum's own
# feature graph: op = ["dep:authkestra-op", "session", "token"]).
authkestra-axum = { version = "=0.7.1", default-features = false, features = ["rustls-no-provider", "op"] }
# JWKS-backed token validation for /dash/v1 request guards.
authkestra-resource = { version = "=0.7.1", default-features = false, features = ["rustls-no-provider"] }

# --- crypto ---
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
# Lowercase hex for the `v1=` values of `Vpay-Signature` and for
# `webhook_deliveries.payload_sha256` (Step 5). Promoted to a workspace pin
# rather than declared per member: it was already in the lock as
# `sdks/rust`'s own `hex = "0.4"` — the *verifier* side of the same header —
# and a sender and a verifier that disagree about hex case or width is
# precisely the drift a shared pin removes. `sdks/rust` keeps its own
# member-level declaration on purpose, because a merchant's crate has to be
# publishable without this workspace.
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"

# --- allocator (docs/adr/0004) ---
mimalloc = { version = "0.1", default-features = false }

# --- test-only ---
# 0.27 (not the newer 0.28) matches the pin `testcontainers-modules 0.15` needs;
# both moved off `bollard 0.18` and its unmaintained `rustls-pemfile` +
# vulnerable `tokio-tar` transitive deps (RUSTSEC-2025-0134, RUSTSEC-2025-0111)
# onto a maintained fork, `astral-tokio-tar`. See deny.toml for the advisories
# this cleared.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
wiremock = "0.6"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
rstest = "0.23"

# --- internal ---
# `version` alongside `path` is required: cargo-deny's `[bans] wildcards =
# "deny"` policy (deny.toml) flags any workspace dep with only a path and no
# version as a wildcard dependency.
vpay-config = { path = "backends/crates/vpay-config", version = "0.1.0" }
vpay-core = { path = "backends/crates/vpay-core", version = "0.1.0" }
vpay-db = { path = "backends/crates/vpay-db", version = "0.1.0" }
vpay-ledger = { path = "backends/crates/vpay-ledger", version = "0.1.0" }
vpay-provider = { path = "backends/crates/vpay-provider", version = "0.1.0" }
vpay-adapter-mtn-momo = { path = "backends/crates/vpay-adapter-mtn-momo", version = "0.1.0" }
vpay-adapter-orange-money = { path = "backends/crates/vpay-adapter-orange-money", version = "0.1.0" }
vpay-api = { path = "backends/crates/vpay-api", version = "0.1.0" }
vpay-worker = { path = "backends/crates/vpay-worker", version = "0.1.0" }
vpay-testkit = { path = "backends/crates/vpay-testkit", version = "0.1.0" }
# The merchant SDK is a workspace member like the rest, but it is not a vpay
# *component*: it is what a merchant depends on. Only `examples/merchant-demo`
# takes it, and only so the demo drives the shipping artefact rather than a
# second copy of the handshake. No `backends/` crate may depend on it — the
# arrow points outward.
vpay-sdk = { path = "sdks/rust", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"

# Faster test builds; nextest runs a lot of them.
[profile.test]
opt-level = 1
