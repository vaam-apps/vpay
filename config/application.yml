# vpay base configuration (ADR-0003: docs/adr/0003-yaml-configuration.md).
#
# Loaded first; `application-{profile}.yml` in this same directory overlays
# it (docs/flows/configuration.md, boot sequence step 1). `${VAR}` values
# are resolved against the process environment at boot — an unresolved one
# is a fatal, named error, never an empty string (step 2).
#
# This file is deliberately a sandbox-shaped example: `livemode: false`
# below means the `https`-only / no-stub-host / no-literal-secret guard
# rules do not apply to it, and its rail hosts point at the WireMock stubs
# from compose.yml. A real livemode deployment overlay must flip
# `livemode: true`, point every host at a real `https://` rail, and keep
# every credential as a `${VAR}` placeholder — never a literal.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

# Each entry may carry `enabled: false` to stop new charges being routed to
# that rail while keeping its host and credentials loaded for the charges
# already on it (boot step 4 writes it to `providers.enabled`). Absent means
# `true`. Capabilities — flow, refund support — are NOT configurable here:
# they belong to the adapter (ADR-0002).
providers:
  - code: mtn_momo
    host:
      # The compose service name from compose.yml, port as seen *inside* the
      # compose network (WireMock listens on 8080; the 8081 host mapping is
      # for a developer's curl, not for vpay). This used to say `wiremock`,
      # a host no compose file defines — never caught because the stack had
      # never been started (docs/status.md, Infrastructure).
      url: http://wiremock-mtn:8080
      label: mtn-sandbox-wiremock
    # EUR, not XAF: MTN's sandbox rejects XAF and accepts EUR only
    # (docs/flows/money.md). That is a property of this *profile*, expressed
    # as a config value — never a code branch (ADR-0003). Amounts against a
    # EUR profile are notional; no FX happens and none is implied.
    currency: EUR
    settings:
      subscription_key_header: Ocp-Apim-Subscription-Key
      # MTN's `X-Target-Environment` header. `sandbox` here; in production it
      # is the country product name MTN issues with the live credentials.
      # Required (vpay_config::config::REQUIRED_RAIL_KEYS) because MTN
      # answers a wrong one with a 500 whose body says
      # NOT_ALLOWED_TARGET_ENVIRONMENT — a failure that reads as "the rail is
      # broken" rather than "our YAML is".
      target_environment: sandbox
      # The UUID half of the Basic credential the token call uses. A settings
      # key, not a credential: it is an identifier, not a bearer secret.
      api_user: ${MTN_API_USER}
    credentials:
      subscription_key: ${MTN_SUBSCRIPTION_KEY}
      api_key: ${MTN_API_KEY}
  - code: orange_money
    host:
      # Includes the `/orange-money-webpay/{env}` path prefix on purpose:
      # docs/flows/adapter-orange-money.md says `base_url` must carry it
      # (`dev` in sandbox, country-specific in production). The WireMock
      # stub's *webpayment* and *transactionstatus* mappings match only
      # under that prefix; its OAuth token mapping (`/oauth/v2/token`) sits
      # at the host root, which the adapter must account for when it exists.
      url: http://wiremock-orange:8080/orange-money-webpay/dev
      label: orange-sandbox-wiremock
    currency: XAF
    settings:
      # Informational only — the path segment above is what actually selects
      # Orange's environment. Kept because the adapter's request body and its
      # hosted page are documented in terms of these two
      # (docs/flows/adapter-orange-money.md).
      env: dev
      lang: en
    credentials:
      # Stays under `credentials` (Step 3's decision 4). It is not a bearer
      # secret — it travels in the request body — but it is per-merchant
      # material, and `ProviderHost`'s Debug redacts `credentials` while
      # printing `settings` in full, so moving it would only make it
      # log-visible.
      merchant_key: ${ORANGE_MERCHANT_KEY}
      client_id: ${ORANGE_CLIENT_ID}
      client_secret: ${ORANGE_CLIENT_SECRET}

# Mirrors backends/migrations/0001_create-currencies.sql. The exponent is a
# property of the currency itself (vpay_core::Currency::exponent) — this
# table is checked against that canonical value at load time, not treated
# as the source of truth.
currencies:
  - code: XAF
    exponent: 0
  - code: EUR
    exponent: 2

# Statically registered OAuth2 clients (ADR-0010, docs/flows/dashboard-auth.md
# — see backends/crates/vpay-config/src/oauth.rs for the validated shape).
#
# `jwks` below is each merchant's PUBLIC key set — publishing a public key
# is the point, so a literal value is correct here, unlike
# `providers[].credentials` above. Do not copy this "literal is fine"
# pattern onto anything that is actually secret. The modulus (`n`) values
# here are placeholders, not a real key — a real merchant's JWK arrives as
# part of their onboarding PR (ADR-0010's "Merchant onboarding is a PR, not
# a self-serve flow").
merchant_clients:
  - client_id: acme-cameroon
    # The tenant this credential acts for: every payment intent it creates
    # carries this as `payment_intents.merchant_id`, and every `/v1` query it
    # makes is filtered by it. Required, unique across `merchant_clients`, and
    # deliberately a separate value from `client_id` — see
    # `MerchantClient::merchant_id` for why a rotated key must not change it.
    merchant_id: acme-cameroon
    # What a payer is told they are paying, on vpay's own checkout page
    # (Step 9). Optional; a registration without it falls back to
    # `merchant_id` above, which is a true name for who is being paid but an
    # internal one — `acme-cameroon` is not what a payer recognises from the
    # site they were just on. Set it for any merchant that uses hosted or
    # embedded checkout.
    #
    # Not secret: it is rendered to every payer of this merchant by
    # construction. At most 80 characters, non-blank if present — it is
    # painted into a heading on a phone-sized page, and the bound is a
    # layout rule rather than a storage one
    # (ConfigError::MalformedDisplayName).
    display_name: Acme Cameroun
    jwks:
      keys:
        - kty: RSA
          use: sig
          kid: acme-cameroon-2026-08
          alg: RS256
          n: placeholder-rsa-modulus-replace-with-the-merchants-real-public-key
          e: AQAB
    grant_types: [client_credentials]
    # What this credential may do, and — because a token request that names
    # no scope is granted this list (RFC 6749 §3.3's default scope, applied
    # in `vpay_api::op::token::token_handler`) — what its tokens carry.
    # `/v1` refuses a request whose token holds none of the scopes its method
    # needs: `payments:write` for a POST, either scope for a GET. The
    # spellings are `vpay_api::v1::SCOPE_PAYMENTS_WRITE` /
    # `SCOPE_PAYMENTS_READ`; nothing validates this list against them at
    # boot, so a typo here is a 403 at runtime rather than a refusal to
    # start.
    scopes: [payments:write]
    # Must contain "vpay:v1" — `vpay_config::MERCHANT_AUDIENCE`, the `aud`
    # `vpay_api::resource_auth::Surface::Merchant` requires on every `/v1`
    # token. This said `vpay` until 2026-09-02, which would have booted fine
    # and then failed at runtime with no diagnostic: the OP answers
    # `invalid_target` to a client that asks for `vpay:v1`, and mints
    # `aud = <client_id>` for one that asks for nothing, which every `/v1`
    # route then rejects as a bare 401. `Config::validate_all` now refuses to
    # boot without it (ConfigError::MerchantMissingV1Audience).
    allowed_audiences: ["vpay:v1"]
    # The keys a payer's *browser* presents on `/v1/browser` alongside the
    # payment intent's own `client_secret` (Step 5c, `@vaam-apps/vpay-stripe-js`).
    #
    # Not secret — this value is rendered into the merchant's public checkout
    # page by construction, exactly like `jwks` above, and it authorises
    # nothing on its own: it names the tenant, and the per-intent
    # `client_secret` is what authorises the request. A publishable key with
    # the wrong `client_secret` is the same 404 as no key at all.
    #
    # Explicit, never derived from `merchant_id` (D1): derivation would make
    # a key unretirable and would let anyone who has seen an object's owner
    # reconstruct it. Rolling a key means adding the new one, deploying, then
    # removing the old.
    #
    # `pk_test_` because `deployment.livemode` above is `false`. The marker
    # is a label a human reads, never a code branch (ADR-0003) — and
    # `Config::validate_all` refuses the combination that would make the
    # label a lie (ConfigError::PublishableKeyLivemodeMismatch). An empty
    # list (the default) is the fail-closed shape for a merchant with no
    # browser checkout.
    publishable_keys: ["pk_test_acmecameroonsandbox01"]
    # The sites allowed to **frame** vpay's embedded checkout page for this
    # merchant (Step 9, D4) — the list
    # `Content-Security-Policy: frame-ancestors` is built from, served to the
    # checkout app by `GET /v1/browser/checkout/origins?key=…`.
    #
    # Each entry is an *origin*: scheme, host, optional port. No path, no
    # query, no fragment, not even a trailing slash — that is what a CSP
    # source expression is, and a browser handed anything else either ignores
    # that source or discards the whole directive. Both failures are silent
    # and both look, to the merchant, exactly like "vpay will not let me
    # embed", so the shape is refused at boot instead
    # (ConfigError::MalformedCheckoutOrigin).
    #
    # It must also be the *canonical* spelling a browser uses: lower-case
    # host, IDNA-encoded, default port left off. `https://Shop.example`,
    # `https://shop.example:443` and `https://shöp.example` are all origins a
    # human would call correct and all three are dropped silently by the
    # checkout app's own filter, so boot refuses them and names what to write
    # instead (ConfigError::NonCanonicalCheckoutOrigin).
    #
    # Not secret — an origin is the merchant's own public website, which is
    # why the lookup takes a publishable key and no `client_secret` at all.
    #
    # **An empty list (the default) is the fail-closed shape and is what most
    # registrations should have**: it means no site may embed, the page
    # answers `frame-ancestors 'none'`, and hosted checkout is unaffected —
    # it is never framed. The value below exists so `just demo` and the
    # Cypress embedded spec have a configured origin to serve a merchant
    # fixture page from.
    #
    # `http://` because this deployment is not live; a livemode one must use
    # `https` (ConfigError::InsecureCheckoutOrigin). Declaring origins with
    # no `checkout.public_base_url` above is refused outright — there would be
    # no page for them to frame.
    checkout_origins: ["http://localhost:4300"]
    # Where this merchant's events are POSTed (docs/flows/webhooks.md), and
    # what each delivery is signed with. Endpoints are YAML, not a `/v1`
    # resource and not a table — see `vpay_config::oauth::WebhookEndpoint`.
    webhooks:
      # Stored verbatim on every `webhook_deliveries` row (migration 0022)
      # and named in the runbook, so it must survive a URL correction —
      # which is exactly why it is not a hash of the URL below.
      - id: primary
        # The compose service name from compose.e2e.yml, port as seen
        # *inside* the compose network, exactly like the two rail stubs
        # above. A WireMock host reached over HTTP, never a linked receiver
        # (ADR-0006). A livemode deployment must overlay this with a real
        # `https://` URL: `validate_host` refuses both the scheme and the
        # `wiremock` marker when `livemode: true`.
        url: http://wiremock-webhook:8080/webhooks
        # One secret; two only while a rotation is in flight (each produces
        # one `v1=` in `Vpay-Signature`). A `${VAR}`, not a literal — under
        # `livemode: true` a literal here is a refusal to boot
        # (ConfigError::LiteralSecret), checked against this file's *text*
        # before placeholders are resolved. Unlike `jwks` above, this value
        # is genuinely secret: whoever holds it can sign a
        # `payment_intent.succeeded` this merchant's handler will believe.
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]

# Where vpay's own checkout page is served from (Step 9, D3/D6). A *second
# deployable* — `frontends/apps/checkout`, its own image and its own Ingress —
# so it is its own block rather than a field on `deployment`, whose
# `public_base_url` above is the API's origin and is what every rail callback
# URL is derived from.
#
# Every payer link vpay mints is built on this value:
#
#   hosted    {public_base_url}/c/{cs_id}#{client_secret}
#   embedded  {public_base_url}/e/{cs_id}?key={pk}#{client_secret}
#   return    {public_base_url}/c/{cs_id}/return?t={return_token}
#
# The credential is in the *fragment* on the first two, which never leaves the
# browser. The return page's token is a separate, weaker credential in a query
# string, because a fragment does not survive a rail's redirect (D6).
#
# **Optional, and absent is a complete answer**: a deployment that omits this
# block serves no checkout page, and `POST /v1/checkout/sessions` answers
# `checkout_not_configured` rather than minting a `url` that resolves to
# nothing. Absent is also what every deployment of this repository had before
# Step 9.
#
# `http://` here because `deployment.livemode` above is `false`; a livemode
# deployment must overlay an `https://` value or refuse to boot
# (ConfigError::InsecureCheckoutBaseUrl) — a plaintext base URL would send a
# live payer credential in clear on every checkout.
#
# A path prefix is legal (`https://api.example/checkout`): whether production
# puts the checkout app on its own host or under a path on the API host is a
# maintainer decision the Step 9 plan leaves open, and the chart templates
# both. A query string or a fragment is refused — vpay appends path segments
# to this value.
#
# 3001, not 3000: 3000 is the dashboard's dev server (see
# `dashboard_client.redirect_uris` in application-sandbox.yml), and two apps
# on one port is the kind of collision that only shows up when both are
# running.
checkout:
  public_base_url: http://localhost:3001

# The dashboard's single OAuth2 client (docs/flows/dashboard-auth.md):
# authorization-code + PKCE, a public client with no secret, requesting
# exactly one read-only scope — the dashboard observes, it does not
# administer (ADR-0008).
dashboard_client:
  client_id: vpay-dashboard
  redirect_uris:
    - http://localhost:8080/dash/v1/callback
  scope: dashboard:read
