# Full end-to-end stack for Cypress.
#
#   docker compose -f compose.yml -f compose.e2e.yml up --build
#
# Brings up Postgres + both rail stubs (from compose.yml) plus the real server,
# worker and dashboard. Nothing in the application knows it is talking to a stub.

name: vpay

services:
  # The demo shop gets its OWN database in this same container, created once
  # by an init script on a fresh volume (`deploy/dev/postgres-init/`). Postgres
  # runs everything in /docker-entrypoint-initdb.d exactly once, on an empty
  # data directory — so a `pgdata` volume from before this file existed has no
  # `shop` database and `vpay-shop` dies in `prisma migrate deploy`.
  # `docker compose ... down -v` (which is what `just demo-down` runs) is the
  # answer; see the SQL file's own header.
  #
  # `volumes:` merges across compose files by TARGET path, so this adds to
  # compose.yml's `pgdata` mount rather than replacing it.
  postgres:
    volumes:
      - ./deploy/dev/postgres-init/10-shop-database.sql:/docker-entrypoint-initdb.d/10-shop-database.sql:ro

  # No `healthcheck:` here. `vpay-server`'s runtime image is `FROM scratch`
  # (docs/adr/0004-musl-mimalloc.md) — no shell, no curl/wget, no package
  # manager, and the only executable in the image is `/vpay-server` itself.
  # A shell-form `CMD-SHELL` healthcheck cannot run there, and adding a
  # second static binary (busybox, wget) just to answer this check would
  # reintroduce the exact attack surface the ADR removed on purpose. The
  # honest fix is a `--healthcheck` self-check mode on the `vpay-server`
  # binary (reusing the one executable already in the image, calling its own
  # `/healthz` over loopback) — that's a `backends/apps/vpay-server` change,
  # out of scope for this file. Until that lands, `dashboard`'s dependency
  # below is the best ordering available, not a guarantee of readiness, and
  # CI observes readiness from outside instead: `.github/workflows/ci.yml`'s
  # e2e job polls `http://localhost:8080/healthz` for a 200 before running
  # Cypress.
  vpay-server:
    build:
      context: .
      dockerfile: backends/Dockerfile
      target: server
    environment:
      VPAY_PROFILE: sandbox
      # Set in the image too (backends/Dockerfile `ENV VPAY_CONFIG`); restated
      # here so the requirement is visible where an operator looks first.
      # Both binaries exit 78 without it — this stack could not boot before
      # 2026-09-02 for exactly that reason.
      VPAY_CONFIG: /config/application.yml
      DATABASE_URL: postgres://vpay:vpay@postgres:5432/vpay
      RUST_LOG: info
      # Every `${VAR}` in config/application.yml must resolve or the process
      # refuses to start. These are the WireMock stubs' credentials — stub
      # values for stub rails, and `livemode: false` in that file is what
      # permits them. They are not secrets and must never be real ones.
      MTN_SUBSCRIPTION_KEY: wiremock-stub-subscription-key
      MTN_API_KEY: wiremock-stub-api-key
      # Added 2026-09-03 (Step 3), when config/application.yml grew the
      # settings and credentials the rail adapters need. A `${VAR}` in that
      # file with no value here is exit 78 at boot for *both* services — the
      # failure this stack has already had once — so the three new names are
      # set on the worker below as well.
      MTN_API_USER: 11111111-2222-3333-4444-555555555555
      ORANGE_MERCHANT_KEY: wiremock-stub-merchant-key
      ORANGE_CLIENT_ID: wiremock-stub-client-id
      ORANGE_CLIENT_SECRET: wiremock-stub-client-secret
      # Added 2026-09-03 (Step 5): `config/application.yml`'s example
      # merchant now names a webhook endpoint, whose `secrets:` is a
      # `${MERCHANT_WEBHOOK_SECRET}` placeholder. Unresolved is exit 78 at
      # boot for BOTH services, so it is set on the worker below as well. A
      # stub value for a stub receiver — `livemode: false` in that file is
      # what permits it; under livemode a literal there is refused outright
      # (ConfigError::LiteralSecret). Thirty-seven bytes, over the 32-byte
      # livemode floor (ConfigError::WeakWebhookSecret) even though sandbox
      # does not apply it: a value copied out of here into a livemode
      # overlay should fail on being a literal, which is the real defect, and
      # not on a length nobody would connect to it.
      MERCHANT_WEBHOOK_SECRET: wiremock-stub-webhook-secret-32-bytes
      # Added 2026-09-04 (Step 9, D12). `just gen-demo-keys` registers a
      # SECOND merchant, `shop-merchant`, whose webhook endpoint's `secrets:`
      # is a `${SHOP_WEBHOOK_SECRET}` placeholder — and an unresolved `${VAR}`
      # in the loaded config is exit 78 at boot for BOTH binaries, so it is
      # set here and on the other service too.
      #
      # It must be the SAME BYTES as `vpay-shop`'s own `VPAY_WEBHOOK_SECRET`
      # below, or every delivery the shop verifies is a 400 and no order ever
      # reaches `paid`. Both read the same `${SHOP_WEBHOOK_SECRET:-…}` default,
      # so overriding one in your environment overrides both.
      #
      # Thirty-four bytes, over the 32-byte livemode floor
      # (ConfigError::WeakWebhookSecret) even though sandbox does not apply
      # it, for the reason MERCHANT_WEBHOOK_SECRET above states.
      SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET:-whsec-shop-demo-secret-32-bytes-xx}
      # The RS256 private key the merchant OP signs `/v1` access tokens with
      # (docs/flows/merchant-auth.md). `vpay-server` refuses to start without
      # it (exit 78). It is a *file*, never an env value, because that is how
      # a Kubernetes Secret reaches a pod; here it is bind-mounted from
      # `.e2e/`, which `just gen-e2e-signing-key` (or CI's openssl step)
      # fills with a throwaway key that is git-ignored and never reused.
      VPAY_OAUTH_SIGNING_KEY_FILE: /secrets/oauth-signing-key.pem
    volumes:
      # Read-only bind mount of the throwaway key. The image runs as UID
      # 65532, so the host file must be world-readable (0644) — acceptable
      # only because this key is generated per stack and thrown away.
      - ./.e2e/oauth-signing-key.pem:/secrets/oauth-signing-key.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      wiremock-mtn: { condition: service_started }
      wiremock-orange: { condition: service_started }
      wiremock-webhook: { condition: service_started }
    ports: ["8080:8080"]
    restart: unless-stopped
    # Comfortably above CommonArgs' default `--shutdown-grace-seconds` (25s,
    # backends/crates/vpay-config/src/cli.rs) so `docker compose down` lets
    # the server's own graceful-shutdown path finish instead of the
    # container being SIGKILLed out from under it before it can.
    stop_grace_period: 30s

  vpay-worker:
    build:
      context: .
      dockerfile: backends/Dockerfile
      target: worker
    environment:
      VPAY_PROFILE: sandbox
      VPAY_CONFIG: /config/application.yml
      DATABASE_URL: postgres://vpay:vpay@postgres:5432/vpay
      RUST_LOG: info
      # Same placeholders as vpay-server: the worker loads the same file.
      MTN_SUBSCRIPTION_KEY: wiremock-stub-subscription-key
      MTN_API_KEY: wiremock-stub-api-key
      MTN_API_USER: 11111111-2222-3333-4444-555555555555
      ORANGE_MERCHANT_KEY: wiremock-stub-merchant-key
      ORANGE_CLIENT_ID: wiremock-stub-client-id
      ORANGE_CLIENT_SECRET: wiremock-stub-client-secret
      MERCHANT_WEBHOOK_SECRET: wiremock-stub-webhook-secret-32-bytes
      # Added 2026-09-04 (Step 9, D12). `just gen-demo-keys` registers a
      # SECOND merchant, `shop-merchant`, whose webhook endpoint's `secrets:`
      # is a `${SHOP_WEBHOOK_SECRET}` placeholder — and an unresolved `${VAR}`
      # in the loaded config is exit 78 at boot for BOTH binaries, so it is
      # set here and on the other service too.
      #
      # It must be the SAME BYTES as `vpay-shop`'s own `VPAY_WEBHOOK_SECRET`
      # below, or every delivery the shop verifies is a 400 and no order ever
      # reaches `paid`. Both read the same `${SHOP_WEBHOOK_SECRET:-…}` default,
      # so overriding one in your environment overrides both.
      #
      # Thirty-four bytes, over the 32-byte livemode floor
      # (ConfigError::WeakWebhookSecret) even though sandbox does not apply
      # it, for the reason MERCHANT_WEBHOOK_SECRET above states.
      SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET:-whsec-shop-demo-secret-32-bytes-xx}
    depends_on:
      postgres: { condition: service_healthy }
      # The worker is the process that will POST to it once the job loop
      # lands — see this file's `wiremock-webhook` service.
      wiremock-webhook: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 30s

  # Stands in for a MERCHANT's webhook receiver, not for a rail.
  #
  # Same mechanism as `wiremock-mtn` and `wiremock-orange` in compose.yml — a
  # host in configuration, reached over HTTP, never a linked receiver
  # (ADR-0006). It lives here rather than in compose.yml because it exists
  # for the two vpay processes this overlay adds: `config/application.yml`'s
  # example merchant points `webhooks[0].url` at
  # `http://wiremock-webhook:8080/webhooks`, which is this service's name and
  # its port as seen *inside* the compose network.
  #
  # 8083 on the host is for a developer's `curl
  # http://localhost:8083/__admin/requests` — which is how you see what vpay
  # actually delivered, headers included. Nothing inside the stack uses it.
  #
  # It also serves `/flaky`, a scenario that answers 500 three times and then
  # 200 (`backends/tests/webhook-receiver/wiremock/mappings/`). That is there
  # for the integration suite; the stack never points an endpoint at it.
  wiremock-webhook:
    image: wiremock/wiremock:3.9.2
    command: ["--global-response-templating", "--verbose"]
    ports: ["8083:8080"]
    volumes:
      - ./backends/tests/webhook-receiver/wiremock:/home/wiremock:ro
    # Same probe, and for the same reason, as the two rail stubs in
    # compose.yml: `/__admin/health` is WireMock's own answer to "am I
    # ready", and it is what `docker compose up --wait` gates `just demo-up`
    # on. It matters more here than on the rails, because the demo's last
    # assertion per outcome reads THIS container's request journal — a
    # receiver that had not finished loading its mappings would answer 404 to
    # a delivery, and the worker would retry it on the delivery ladder rather
    # than the demo failing on it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Orange stub's published port is LOAD-BEARING in this stack, and it is
  # restated here rather than left implicit in compose.yml.
  #
  # Orange is a redirect rail: since Step 9 the stub serves the rail's own
  # hosted page at `/stub-hosted-page/{pay_token}`
  # (`backends/tests/conformance/wiremock/orange/mappings/stub-hosted-page.json`),
  # and `webpayment.json` templates a `payment_url` pointing at
  # `http://localhost:8082` — the port compose.yml publishes. A PAYER'S
  # BROWSER follows that URL: Cypress does it with `cy.origin()`, and a human
  # running `just demo` clicks it. So a future `ports: !reset []` here (the
  # thing compose.demo.yml did until Step 9, for the perfectly good reason
  # that nothing *inside* the stack needs the port) would not merely hide a
  # request journal — it would break the redirect leg, in the browser, with
  # nothing in any log saying why.
  #
  # `!override` rather than a plain list because compose APPENDS `ports:`
  # across files and this would otherwise be a duplicate publication of the
  # same host port. The value is compose.yml's own, deliberately: the mapping
  # spells 8082 and a stub cannot learn what the host published it on.
  wiremock-orange:
    ports: !override ["8082:8080"]

  dashboard:
    build:
      context: .
      dockerfile: frontends/Dockerfile
      # Explicit since Step 9, and it has to be: `frontends/Dockerfile` now
      # builds two images, and "the last stage wins" stopped being a safe way
      # to say which one. The stage kept its name so this is the only line
      # that had to change.
      target: runner
    environment:
      VPAY_DASH_API: http://vpay-server:8080
    depends_on:
      # `service_started`, not `service_healthy`: `vpay-server` has no
      # healthcheck to report healthy (see the comment above it). This is a
      # boot-order guarantee only — the dashboard can still start before the
      # server has finished binding its listener. That race is currently
      # harmless: per docs/status.md the dashboard renders a static scaffold
      # notice and makes no server-side call to `vpay-server` yet. Revisit
      # this once the dashboard actually calls `/dash/v1` on render.
      vpay-server: { condition: service_started }
    ports: ["3000:3000"]
    restart: unless-stopped

  # vpay's own hosted/embedded payment page (Step 9, D3) — `frontends/apps/checkout`.
  #
  # A SECOND Next.js image, not HTML from `vpay-server`, which is why it is a
  # service here at all. It holds no merchant credential and never reads
  # `@vpay/api-client`: everything it does is either the payer's own
  # credential out of the URL fragment, or the one server-side lookup below.
  #
  # The two API URLs are not redundant — they are the same API seen from two
  # places, and inside compose those differ:
  #
  #   VPAY_API_URL             this SERVER's view. `middleware.ts` calls
  #                            GET /v1/browser/checkout/origins?key= with it,
  #                            server-side, to build the embedded page's
  #                            `Content-Security-Policy: frame-ancestors`.
  #                            A compose service name, reachable only inside
  #                            the network. Without it the embedded page's CSP
  #                            is `frame-ancestors 'none'` — correct, and it
  #                            means nobody can embed.
  #   NEXT_PUBLIC_VPAY_API_URL the BROWSER's view: the `/v1/browser` base every
  #                            confirm and poll goes to. It must be the
  #                            published host origin. Read at RUNTIME (lane 3
  #                            reads `process.env` with bracket notation
  #                            precisely so `next build` cannot inline one
  #                            deployment's value), and a missing one throws
  #                            rather than defaulting.
  #
  # No `healthcheck:` block: the image carries its own (`frontends/Dockerfile`),
  # which is what `docker compose up --wait` gates on. Restating it here would
  # be a second copy to keep in sync.
  vpay-checkout:
    build:
      context: .
      dockerfile: frontends/Dockerfile
      target: checkout
    environment:
      VPAY_API_URL: http://vpay-server:8080
      NEXT_PUBLIC_VPAY_API_URL: http://localhost:8080
    depends_on:
      # `service_started`, not `service_healthy`: `vpay-server` is `FROM
      # scratch` and can carry no healthcheck (see the note above it). The
      # page copes with an API that is not up yet — it renders and reports —
      # so this is boot ordering, not a readiness guarantee.
      vpay-server: { condition: service_started }
    ports: ["3080:3000"]
    # The image writes nothing outside /tmp: non-root (`node`, uid 1000), and
    # `HOME`/`XDG_CACHE_HOME` already point at /tmp in the Dockerfile.
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # The demo merchant's own storefront (Step 9, D11) — `examples/shop`.
  #
  # This is a MERCHANT's system, not part of vpay: it holds its own database,
  # its own merchant credential (`shop-merchant`, D12), and it learns that an
  # order is paid from vpay's WEBHOOK and from nothing else.
  #
  # The service block below is `docs/plans/step9-notes/lane-7.md` §2, with the
  # two published ports the integrator settled in that note's addendum
  # (shop 3001, checkout 3080).
  vpay-shop:
    build:
      context: .
      dockerfile: examples/shop/Dockerfile
    environment:
      # Its own database in the shared `postgres` container — see the
      # `postgres` service above.
      DATABASE_URL: postgres://vpay:vpay@postgres:5432/shop
      # vpay as THIS SERVER reaches it: the compose service name.
      VPAY_API_URL: http://vpay-server:8080
      # vpay as a BROWSER reaches it: the published host port. The two differ
      # inside compose, which is the whole reason there are two variables.
      VPAY_BROWSER_API_URL: http://localhost:8080
      # vpay as VPAY names itself — the `aud` of the shop's client assertion,
      # and a THIRD value, not a copy of either URL above.
      # `authenticate_client` compares that claim against
      # `{deployment.public_base_url}/v1/oauth/token` and the `/v1/oauth`
      # issuer built from the same setting, and against nothing else; the URL
      # the shop POSTed to is never consulted. The generated overlay's
      # `deployment.public_base_url` is `http://localhost:8080`, so this is
      # that plus the token path. Unset, every token request from the shop is
      # an `invalid_client` whose response says nothing about audiences.
      VPAY_OAUTH_AUDIENCE: http://localhost:8080/v1/oauth/token
      VPAY_CLIENT_ID: shop-merchant
      VPAY_PRIVATE_KEY_FILE: /secrets/shop-merchant.pem
      VPAY_PUBLISHABLE_KEY: pk_test_shopmerchantsandbox1
      # The checkout app, as a browser reaches it (it is an iframe `src`).
      VPAY_CHECKOUT_URL: http://localhost:3080
      # Must be byte-identical to the secret in the generated overlay's
      # `shop-merchant.webhooks[0].secrets`.
      VPAY_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET:-whsec-shop-demo-secret-32-bytes-xx}
      # Where vpay redirects a payer back to.
      SHOP_PUBLIC_URL: http://localhost:3001
      # `SHOP_PAYMENT_METHOD_TYPES` is deliberately NOT set: the shop offers
      # both rails, and the demo overlay puts both of them on XAF so both can
      # complete an XAF order. See `gen-demo-keys`'s `providers:` block.
    volumes:
      # The merchant's PRIVATE key. Unlike `demo-merchant`'s, this one is
      # mounted into a container, because the shop is the merchant's own
      # server. Read-only; `just gen-demo-keys` chmods it 0644 (the image runs
      # as uid 1000, not root).
      - ./.e2e/shop-merchant/oauth-signing-key.pem:/secrets/shop-merchant.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      vpay-server: { condition: service_started }
    ports: ["3001:3000"]
    # The image writes nothing outside /tmp: non-root (`node`, uid 1000),
    # read-only root filesystem, and `HOME`/`XDG_CACHE_HOME` already point at
    # /tmp in the Dockerfile.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 25s
      retries: 12
    restart: unless-stopped
