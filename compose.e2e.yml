# Full end-to-end stack for Cypress.
#
#   docker compose -f compose.yml -f compose.e2e.yml up --build
#
# Brings up Postgres + both rail stubs (from compose.yml) plus the real server,
# worker and dashboard. Nothing in the application knows it is talking to a stub.

name: vpay

services:
  # No `healthcheck:` here. `vpay-server`'s runtime image is `FROM scratch`
  # (docs/adr/0004-musl-mimalloc.md) — no shell, no curl/wget, no package
  # manager, and the only executable in the image is `/vpay-server` itself.
  # A shell-form `CMD-SHELL` healthcheck cannot run there, and adding a
  # second static binary (busybox, wget) just to answer this check would
  # reintroduce the exact attack surface the ADR removed on purpose. The
  # honest fix is a `--healthcheck` self-check mode on the `vpay-server`
  # binary (reusing the one executable already in the image, calling its own
  # `/healthz` over loopback) — that's a `backends/apps/vpay-server` change,
  # out of scope for this file. Until that lands, `dashboard`'s dependency
  # below is the best ordering available, not a guarantee of readiness, and
  # CI observes readiness from outside instead: `.github/workflows/ci.yml`'s
  # e2e job polls `http://localhost:8080/healthz` for a 200 before running
  # Cypress.
  vpay-server:
    build:
      context: .
      dockerfile: backends/Dockerfile
      target: server
    environment:
      VPAY_PROFILE: sandbox
      # Set in the image too (backends/Dockerfile `ENV VPAY_CONFIG`); restated
      # here so the requirement is visible where an operator looks first.
      # Both binaries exit 78 without it — this stack could not boot before
      # 2026-09-02 for exactly that reason.
      VPAY_CONFIG: /config/application.yml
      DATABASE_URL: postgres://vpay:vpay@postgres:5432/vpay
      RUST_LOG: info
      # Every `${VAR}` in config/application.yml must resolve or the process
      # refuses to start. These are the WireMock stubs' credentials — stub
      # values for stub rails, and `livemode: false` in that file is what
      # permits them. They are not secrets and must never be real ones.
      MTN_SUBSCRIPTION_KEY: wiremock-stub-subscription-key
      MTN_API_KEY: wiremock-stub-api-key
      # Added 2026-09-03 (Step 3), when config/application.yml grew the
      # settings and credentials the rail adapters need. A `${VAR}` in that
      # file with no value here is exit 78 at boot for *both* services — the
      # failure this stack has already had once — so the three new names are
      # set on the worker below as well.
      MTN_API_USER: 11111111-2222-3333-4444-555555555555
      ORANGE_MERCHANT_KEY: wiremock-stub-merchant-key
      ORANGE_CLIENT_ID: wiremock-stub-client-id
      ORANGE_CLIENT_SECRET: wiremock-stub-client-secret
      # Added 2026-09-03 (Step 5): `config/application.yml`'s example
      # merchant now names a webhook endpoint, whose `secrets:` is a
      # `${MERCHANT_WEBHOOK_SECRET}` placeholder. Unresolved is exit 78 at
      # boot for BOTH services, so it is set on the worker below as well. A
      # stub value for a stub receiver — `livemode: false` in that file is
      # what permits it; under livemode a literal there is refused outright
      # (ConfigError::LiteralSecret). Thirty-seven bytes, over the 32-byte
      # livemode floor (ConfigError::WeakWebhookSecret) even though sandbox
      # does not apply it: a value copied out of here into a livemode
      # overlay should fail on being a literal, which is the real defect, and
      # not on a length nobody would connect to it.
      MERCHANT_WEBHOOK_SECRET: wiremock-stub-webhook-secret-32-bytes
      # The RS256 private key the merchant OP signs `/v1` access tokens with
      # (docs/flows/merchant-auth.md). `vpay-server` refuses to start without
      # it (exit 78). It is a *file*, never an env value, because that is how
      # a Kubernetes Secret reaches a pod; here it is bind-mounted from
      # `.e2e/`, which `just gen-e2e-signing-key` (or CI's openssl step)
      # fills with a throwaway key that is git-ignored and never reused.
      VPAY_OAUTH_SIGNING_KEY_FILE: /secrets/oauth-signing-key.pem
    volumes:
      # Read-only bind mount of the throwaway key. The image runs as UID
      # 65532, so the host file must be world-readable (0644) — acceptable
      # only because this key is generated per stack and thrown away.
      - ./.e2e/oauth-signing-key.pem:/secrets/oauth-signing-key.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      wiremock-mtn: { condition: service_started }
      wiremock-orange: { condition: service_started }
      wiremock-webhook: { condition: service_started }
    ports: ["8080:8080"]
    restart: unless-stopped
    # Comfortably above CommonArgs' default `--shutdown-grace-seconds` (25s,
    # backends/crates/vpay-config/src/cli.rs) so `docker compose down` lets
    # the server's own graceful-shutdown path finish instead of the
    # container being SIGKILLed out from under it before it can.
    stop_grace_period: 30s

  vpay-worker:
    build:
      context: .
      dockerfile: backends/Dockerfile
      target: worker
    environment:
      VPAY_PROFILE: sandbox
      VPAY_CONFIG: /config/application.yml
      DATABASE_URL: postgres://vpay:vpay@postgres:5432/vpay
      RUST_LOG: info
      # Same placeholders as vpay-server: the worker loads the same file.
      MTN_SUBSCRIPTION_KEY: wiremock-stub-subscription-key
      MTN_API_KEY: wiremock-stub-api-key
      MTN_API_USER: 11111111-2222-3333-4444-555555555555
      ORANGE_MERCHANT_KEY: wiremock-stub-merchant-key
      ORANGE_CLIENT_ID: wiremock-stub-client-id
      ORANGE_CLIENT_SECRET: wiremock-stub-client-secret
      MERCHANT_WEBHOOK_SECRET: wiremock-stub-webhook-secret-32-bytes
    depends_on:
      postgres: { condition: service_healthy }
      # The worker is the process that will POST to it once the job loop
      # lands — see this file's `wiremock-webhook` service.
      wiremock-webhook: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 30s

  # Stands in for a MERCHANT's webhook receiver, not for a rail.
  #
  # Same mechanism as `wiremock-mtn` and `wiremock-orange` in compose.yml — a
  # host in configuration, reached over HTTP, never a linked receiver
  # (ADR-0006). It lives here rather than in compose.yml because it exists
  # for the two vpay processes this overlay adds: `config/application.yml`'s
  # example merchant points `webhooks[0].url` at
  # `http://wiremock-webhook:8080/webhooks`, which is this service's name and
  # its port as seen *inside* the compose network.
  #
  # 8083 on the host is for a developer's `curl
  # http://localhost:8083/__admin/requests` — which is how you see what vpay
  # actually delivered, headers included. Nothing inside the stack uses it.
  #
  # It also serves `/flaky`, a scenario that answers 500 three times and then
  # 200 (`backends/tests/webhook-receiver/wiremock/mappings/`). That is there
  # for the integration suite; the stack never points an endpoint at it.
  wiremock-webhook:
    image: wiremock/wiremock:3.9.2
    command: ["--global-response-templating", "--verbose"]
    ports: ["8083:8080"]
    volumes:
      - ./backends/tests/webhook-receiver/wiremock:/home/wiremock:ro
    # Same probe, and for the same reason, as the two rail stubs in
    # compose.yml: `/__admin/health` is WireMock's own answer to "am I
    # ready", and it is what `docker compose up --wait` gates `just demo-up`
    # on. It matters more here than on the rails, because the demo's last
    # assertion per outcome reads THIS container's request journal — a
    # receiver that had not finished loading its mappings would answer 404 to
    # a delivery, and the worker would retry it on the delivery ladder rather
    # than the demo failing on it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  dashboard:
    build:
      context: .
      dockerfile: frontends/Dockerfile
    environment:
      VPAY_DASH_API: http://vpay-server:8080
    depends_on:
      # `service_started`, not `service_healthy`: `vpay-server` has no
      # healthcheck to report healthy (see the comment above it). This is a
      # boot-order guarantee only — the dashboard can still start before the
      # server has finished binding its listener. That race is currently
      # harmless: per docs/status.md the dashboard renders a static scaffold
      # notice and makes no server-side call to `vpay-server` yet. Revisit
      # this once the dashboard actually calls `/dash/v1` on render.
      vpay-server: { condition: service_started }
    ports: ["3000:3000"]
    restart: unless-stopped
