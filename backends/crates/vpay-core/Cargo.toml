[package]
name = "vpay-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `privacy`: HMAC-SHA256 for `Pseudonymous` — the keyed, domain-separated
# digest RFC-0002 D3's own recommendation argues for on low-entropy
# identifiers. Both pins already resolved in the lock by `vpay-api`,
# `vpay-provider` and `vpay-worker`, so no new package enters it.
hmac.workspace = true
# `privacy`: the SHA-256 under that HMAC, and lowercase hex for its output
# — the same `hex` pin `Vpay-Signature`'s `v1=` values use.
sha2.workspace = true
hex.workspace = true
# `metrics`: the facade only. This crate describes every metric name
# (`metrics.rs`) and installs no recorder — see that module's header.
metrics.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
# `privacy`: `SafeUrl` prints `scheme://host[:port]` from the same `url`
# pin `vpay-config` validates endpoint hosts with — one URL parser in the
# workspace, not a second hand-rolled one next to it.
url.workspace = true
# `ids`: the CSPRNG behind every public object id (`pi_…`), via `Uuid::new_v4`.
uuid.workspace = true

[dev-dependencies]
# Test-only, and deliberately the *shipping* exporter rather than
# `metrics-util`'s `DebuggingRecorder`: `metrics.rs`'s tests assert on the
# rendered Prometheus text, which is what a scrape of a pod actually
# receives, so a mis-spelled label fails here for the same reason a dashboard
# would be empty. Enabling metrics-util's `debugging` feature instead would
# add `ordered-float` to `Cargo.lock` for a weaker assertion. Already
# resolved at this exact pin by both binaries, so no new package enters the
# lockfile — and it stays out of this crate's *shipping* graph, where
# installing a recorder from a library is the thing `metrics.rs`' header
# forbids.
metrics-exporter-prometheus.workspace = true
# Test-only. `state.rs` writes each status's wire label twice — once for
# `serde` (what a merchant reads) and once as `as_wire_str` (what a `WHERE`
# clause matches) — and the test that pins the two together needs a
# serializer to compare them through. No production dependency: this crate
# still has no JSON in its own API.
serde_json.workspace = true
