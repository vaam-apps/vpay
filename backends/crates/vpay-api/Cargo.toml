[package]
name = "vpay-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
vpay-provider.workspace = true
vpay-db.workspace = true
# `ApiError` wraps `LedgerError` too (ADR-0011: a composite `#[from]`s every
# leaf its layer can meet). A ledger transaction built while serving a
# request that does not balance is our bug and must answer 500 and page, not
# whatever the nearest handler would have invented. This *does* add
# `vpay-ledger` itself to both binaries' graphs — neither linked it before —
# but no third-party package: `vpay-ledger` depends only on `vpay-core`,
# serde, thiserror, tracing and uuid, all of which the binaries already link.
vpay-ledger.workspace = true
# `ApiError` wraps `ConfigError` (ADR-0011: a composite `#[from]`s every leaf
# its layer can meet). Per-merchant, per-rail configuration is resolved when a
# request is served, not only at boot, so a misconfiguration surfaces as a 500
# on a request path. No cycle: `vpay-config` depends on `vpay-core` and leaf
# crates only, never on `vpay-api`. No new package in the *binaries'* graph
# either — both already link `vpay-config`. `vpay-api`'s own graph does grow:
# building or testing this crate alone now pulls clap, figment, garde and
# serde_yaml_ng in through `vpay-config`.
vpay-config.workspace = true
axum.workspace = true
tokio.workspace = true
# `ServiceBuilder`, so `router()`'s middleware order is written top-down in
# the order a request traverses it rather than inferred from nested
# `.layer()` calls — the order is load-bearing here (id, then span, then
# propagate) and worth being unable to misread. Was a dev-dependency until
# the layers below became production middleware.
tower.workspace = true
# `SetRequestIdLayer`/`PropagateRequestIdLayer` (feature `request-id`, which
# enables tower-http's own `uuid` dependency, so `MakeRequestUuid` needs no
# extra feature at the workspace pin) and `TraceLayer` (feature `trace`).
# Both features are already on the root `Cargo.toml`'s pin; this crate is
# the first member to use them. No new package in either binary's resolved
# graph — `reqwest` already pulls tower-http in (`cargo tree -i tower-http`).
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Offline (cached-JWKS) bearer-token validation for the two authenticated
# surfaces (`/v1`, `/dash/v1`) — see src/resource_auth.rs. Already a
# workspace dependency (root Cargo.toml pins it for exactly this); added
# here at the member level only, per docs/api/README.md's OP-3 scope.
authkestra-resource.workspace = true
# `authkestra-resource` depends on jsonwebtoken with the `rust_crypto`
# backend (pure-Rust RSA/EC/Ed25519, no `ring`/`aws-lc-rs` — unrelated to
# rustls's TLS crypto provider, see deny.toml). Not itself a workspace
# dependency; pinned to the same major version and feature set authkestra-
# resource already resolves, so this adds no new package to the graph, only
# makes an already-resolved one directly importable here.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[dev-dependencies]
# Test-only: the request-id tests parse the generated header value as a UUID
# rather than asserting it is merely non-empty, so a `MakeRequestId` that
# handed back a constant would fail. Already resolved in the graph via
# tower-http's `request-id` feature; the workspace pin is reused verbatim.
uuid.workspace = true
# Test-only: `DbError`'s variants all wrap a `sqlx::Error`, and the test that
# proves a leaf's text reaches the log and not the response body has to build
# one with a recognisable string inside it. `vpay-db` re-exports `PgPool` but
# not `sqlx::Error`, and the workspace pin is reused verbatim so this adds no
# package and no feature to the resolved graph.
sqlx.workspace = true
# Test-only: captures `tracing` output into a buffer so the log/body split
# above is asserted on what an operator would actually see, rather than on the
# arguments this crate passed to a macro.
tracing-subscriber.workspace = true
wiremock.workspace = true
rand.workspace = true
# Test-only: `authkestra_resource::jwt::JwksCache` fetches over `reqwest`,
# which eagerly builds a rustls TLS config even for a plain-HTTP wiremock
# target and panics without a process-default `CryptoProvider` installed
# (root Cargo.toml's own comment on the authkestra-* pins names this exact
# prerequisite). Installing it is test setup here, not production code —
# whichever agent wires this module into a real binary must make the same
# call once in `main()`, before the first JWKS fetch.
rustls.workspace = true
# Test-only: mints RSA keypairs to sign JWTs against, so validation is
# exercised against real cryptographic material rather than a stub. Already
# in the resolved graph via authkestra-engine (see deny.toml's RUSTSEC-2023-
# 0071 note); not a workspace dependency, so pinned directly here the same
# way jsonwebtoken is above.
rsa = "0.9"
base64 = "0.22"
