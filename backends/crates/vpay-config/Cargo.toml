[package]
name = "vpay-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
# `ProviderHost::to_provider_config` returns a `vpay_provider::ProviderConfig`:
# the projection from YAML onto what an adapter is handed lives here, on the
# side that owns the YAML shape, so the server and the worker cannot derive a
# rail's callback URL differently. Acyclic — `vpay-provider` depends on
# `vpay-core` and never on this crate. It does pull reqwest/rustls into
# *this crate's* build (the port owns `vpay_provider::http` since Step 3);
# both binaries already resolved all three, so no binary graph changed.
vpay-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
figment.workspace = true
garde.workspace = true
serde_yaml_ng.workspace = true
# Only for `validate_webhook_endpoints`: the two questions about a webhook URL
# that a substring rule cannot answer — does it parse, and does it carry
# userinfo. Not used to *build* URLs anywhere in this crate.
url.workspace = true
clap.workspace = true
tokio.workspace = true
# `oauth::CoseKey::verify_key`: reading a merchant's Ed25519 public key
# (`CoseVerifyKey`, which also refuses bytes that are not a curve point) and
# its RFC 9679 thumbprint, so the boot check and the `/v1` key registry in
# `vpay-api` parse a key with the same code. Not the `cratestack` facade: that
# is `cratestack-pg`, and linking `cratestack-sqlx` into the crate that reads
# YAML to check 32 bytes is the wrong direction. No new package in the lock
# (`cratestack-cose` is there since VP-1).
cratestack-cose.workspace = true
# Unpadded base64url, the encoding a JWK and a COSE key thumbprint are written
# in, for `cose_keys[].public_key`. The same `0.22` pin `vpay-api` declares at
# member level; `cratestack-core` also brings 0.23 for its own use.
base64 = "0.22"
