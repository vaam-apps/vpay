# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-1).
#
# A legacy-only deployment: `machine_tokens` alone, so the envelope is off and no
# key is registered. Must load.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

auth:
  methods: [machine_tokens]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
