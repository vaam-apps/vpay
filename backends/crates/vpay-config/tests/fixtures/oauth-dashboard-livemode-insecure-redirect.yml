# Fixture for `a_livemode_dashboard_redirect_uri_that_is_not_https_is_rejected`
# (backends/crates/vpay-config/src/config.rs). Reuses `validate_host`'s
# https-only-under-livemode rule over each redirect URI — see
# `validate_dashboard_client`'s doc comment for why that reuse is sound.

deployment:
  name: prod
  livemode: true
  public_base_url: https://dashboard.vpay.example

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: no-such-tenant-checked-later
  redirect_uris:
    - http://dashboard.vpay.example/callback
  scope: dashboard:read

# The other block of `human_login` (ADR-0037): present so the rule this file
# exercises is the one that trips, not `AuthMethodNotConfigured`.
staff_auth:
  password_pepper: fixture-pepper
  totp_encryption_key: fixture-key
