# Fixture for `a_dashboard_client_secret_is_also_rejected`
# (backends/crates/vpay-config/src/config.rs). The dashboard is a public
# client with no secret at all (docs/flows/dashboard-auth.md) — this proves
# `validate_dashboard_client`'s own client_secret check, not just the
# merchant path.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: no-such-tenant-checked-later
  redirect_uris:
    - http://localhost:3000/callback
  scope: dashboard:read
  client_secret: this-should-never-be-here

# The other block of `human_login` (ADR-0037): present so the rule this file
# exercises is the one that trips, not `AuthMethodNotConfigured`.
staff_auth:
  password_pepper: fixture-pepper
  totp_encryption_key: fixture-key
