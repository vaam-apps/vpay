# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-1).
#
# Under `[keypair]` a merchant with no `cose_keys` has no credential either
# (a `jwks` would be refused outright): MerchantNoCredential.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

auth:
  methods: [keypair]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    scopes: [payments:write]
