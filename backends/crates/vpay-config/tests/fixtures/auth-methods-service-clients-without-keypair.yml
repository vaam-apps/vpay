# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-1).
#
# `service_clients` while `keypair` is not permitted (AuthMethodDisabled).

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

auth:
  methods: [machine_tokens]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]

service_clients:
  - client_id: vaam
    capabilities: [console_pairing]
    cose_keys:
      - public_key: PUAXw-hDiVqStwqnTRt-vJyYLM8uxJaMwM1V8Sr0Zgw
