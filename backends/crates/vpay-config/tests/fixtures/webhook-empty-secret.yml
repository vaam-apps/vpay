# Fixture for `a_blank_webhook_secret_is_rejected_even_in_sandbox`
# (backends/crates/vpay-config/src/config.rs).
#
# One secret, present, and blank. Sandbox on purpose: in livemode the
# literal-secret rule would fire first and this fixture would prove nothing
# about the emptiness rule. An HMAC keyed on "" is a perfectly well-formed
# signature that anybody else can also produce.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: http://receiver.internal/webhooks
        secrets: ["  "]
