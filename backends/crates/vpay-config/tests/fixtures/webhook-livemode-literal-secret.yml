# Fixture for `a_livemode_webhook_secret_written_as_a_literal_is_rejected`
# (backends/crates/vpay-config/src/config.rs).
#
# THE POINT OF THIS FILE is the gap Step 5's S3 named
# (docs/plans/2026-09-03-step5-webhooks.md): before 2026-09-03 the
# livemode literal-secret walk covered `providers[].credentials` only, so
# exactly this document booted clean. One of these values is enough to sign a
# `payment_intent.succeeded` a merchant's handler will act on.
#
# Everything else here is a correctly written livemode deployment: https, no
# stub markers, one endpoint, one secret. The ONLY defect is that the secret is
# a literal rather than a `${VAR}` — so if the rule were deleted, this file
# would load.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: https://hooks.acme.example/vpay
        secrets: [whsec_a_real_looking_literal]
