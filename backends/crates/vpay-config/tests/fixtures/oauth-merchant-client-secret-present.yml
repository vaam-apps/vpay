# Fixture for `a_client_secret_anywhere_in_the_config_is_rejected`
# (backends/crates/vpay-config/src/config.rs). ADR-0010: vpay stores no
# merchant secret, in any form. A config carrying one must refuse to boot,
# not silently ignore the field.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    client_secret: this-should-never-be-here
