# Fixture for `a_stray_key_under_deployment_is_a_shape_error`
# (backends/crates/vpay-config/src/config.rs, ADR-0037, VPA-1 follow-up).
#
# `surface:` is not `surfaces:`, and not `auth` either, so the walk over the raw
# document has nothing to say about it. `Deployment` denies unknown fields, which
# is the only thing that stops a mistyped `deployment` key from being dropped.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080
  surface: [mcp]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-ci
