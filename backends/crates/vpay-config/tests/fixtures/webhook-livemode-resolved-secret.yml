# Fixture for `a_livemode_webhook_secret_written_as_a_placeholder_loads`
# (backends/crates/vpay-config/src/config.rs).
#
# The other half of the pair: the same livemode deployment written correctly,
# with a `${VAR}` that RESOLVES. A fixture whose variable was unset would fail
# at step 2 with `UnresolvedPlaceholder` and never reach the rule at all — the
# same trap `livemode-resolved-secret.yml` documents for rail credentials, and
# the reason the check has to read the file's text rather than the value.
#
# Two secrets, because a rotation in flight is the shape an operator is most
# likely to be editing when they get this wrong.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: https://hooks.acme.example/vpay
        secrets: ["${MERCHANT_WEBHOOK_SECRET}", "${MERCHANT_WEBHOOK_SECRET_NEXT}"]
