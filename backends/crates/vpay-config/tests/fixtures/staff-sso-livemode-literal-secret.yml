# Fixture for `a_livemode_sso_client_secret_must_be_a_placeholder`
# (backends/crates/vpay-config/src/config.rs).
#
# A LIVEMODE document whose only defect is that `staff_auth.sso.client_secret`
# is a literal rather than a ${VAR} — the rule every other secret in this
# document obeys. The pepper and the TOTP key are placeholders, so the
# literal-secret refusal that fires is the SSO one and names it.

deployment:
  name: vpay
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme
    merchant_id: acme-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: [vpay:v1]

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-tenant
  redirect_uris:
    - https://dashboard.vpay.example/api/auth/callback
  scope: dashboard:read

staff_auth:
  password_pepper: ${STAFF_PEPPER}
  totp_encryption_key: ${STAFF_TOTP_KEY}
  sso:
    issuer: https://auth.example.test/realms/staff
    client_id: vpay-staff
    client_secret: a-literal-client-secret
    redirect_uri: https://dashboard.vpay.example/api/auth/sso/callback
    required_group: vpay-staff
    accepted_amr: [otp]
