# Fixture for `a_livemode_webhook_secret_below_the_floor_is_refused`
# (backends/crates/vpay-config/src/config.rs).
#
# Correctly written as a `${VAR}` — so `ConfigError::LiteralSecret` is
# satisfied — and the test resolves that variable to a single byte. That is
# the whole point of the pair: "came from the environment" and "is worth
# having" are two different questions, and before this rule the second one
# was never asked. Whoever recovers this key can forge a
# `payment_intent.succeeded` the merchant will ship goods against.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: https://hooks.acme.example/vpay
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]
