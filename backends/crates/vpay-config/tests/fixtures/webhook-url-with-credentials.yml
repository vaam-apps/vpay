# Fixture for `every_webhook_endpoint_rule_refuses_its_own_fixture`
# (backends/crates/vpay-config/src/config.rs).
#
# `user:password@` userinfo in the endpoint URL. reqwest turns it into an
# `Authorization: Basic` header on every attempt — so the URL is a credential,
# and this one is copied verbatim onto every `webhook_deliveries` row
# (migration 0022 denormalises it) and printed in full by
# `EndpointRegistry`'s Debug, which redacts `secrets` and deliberately does
# not redact `url`.
#
# Sandbox: a URL is not a place to put a secret in either deployment.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: http://svc:hunter2@receiver.internal/webhooks
        secrets: [whsec-sandbox-literal-is-fine-here]
