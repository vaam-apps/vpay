# Fixture for `a_dashboard_client_with_no_redirect_uris_is_rejected`
# (backends/crates/vpay-config/src/config.rs). A client that can never
# redirect back can never complete authorization-code + PKCE, so an empty
# `redirect_uris` is fatal at boot, unconditionally (not just in livemode).

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: no-such-tenant-checked-later
  redirect_uris: []
  scope: dashboard:read

# The other block of `human_login` (ADR-0037): present so the rule this file
# exercises is the one that trips, not `AuthMethodNotConfigured`.
staff_auth:
  password_pepper: fixture-pepper
  totp_encryption_key: fixture-key
