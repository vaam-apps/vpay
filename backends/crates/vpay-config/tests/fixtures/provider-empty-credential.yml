# Fixture for `a_required_key_present_but_empty_is_treated_as_missing`
# (backends/crates/vpay-config/src/config.rs). Every required key is spelled
# out; `client_secret` is an empty string. A key that is present and blank is
# the shape that would otherwise pass boot and fail on the wire as a 401 that
# names nothing.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

providers:
  - code: orange_money
    currency: XAF
    host:
      url: http://wiremock-orange:8080/orange-money-webpay/dev
      label: orange-sandbox-wiremock
    credentials:
      merchant_key: merchant-key
      client_id: client-id
      client_secret: ""
