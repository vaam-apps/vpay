# Fixture for `a_livemode_config_whose_placeholders_resolve_loads`
# (backends/crates/vpay-config/src/config.rs).
#
# THE POINT OF THIS FILE is that it is a livemode deployment written
# correctly — https hosts, no stub labels, every credential a `${VAR}` — and
# that every one of those variables RESOLVES. Before 2026-09-03 this could
# not load: `validate_secret`'s "must be a `${VAR}`" rule ran *after* the
# placeholders had been substituted, so `${MTN_API_KEY}` was
# `api-key-test` by the time the rule saw it and every livemode deployment
# failed with `LiteralSecret`. A fixture whose variables are all unset would
# not have caught that — it would have failed at step 2 with
# `UnresolvedPlaceholder` and never reached the rule.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

providers:
  - code: mtn_momo
    currency: EUR
    host:
      url: https://proxy.momoapi.mtn.com
      label: mtn-cm-prod
    settings:
      target_environment: mtncameroon
      api_user: ${MTN_API_USER}
    credentials:
      subscription_key: ${MTN_SUBSCRIPTION_KEY}
      api_key: ${MTN_API_KEY}

currencies:
  - code: EUR
    exponent: 2
