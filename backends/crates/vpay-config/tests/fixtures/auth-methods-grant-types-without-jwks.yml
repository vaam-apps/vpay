# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037 decision 4, VPA-1).
#
# `machine_tokens` is permitted (the default) and the merchant declares
# `grant_types` but no `jwks`: an OAuth half with nothing to authenticate it.
# Dormant configuration is how an operator comes to believe a door is open; it
# is refused.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-ci
    grant_types: [client_credentials]
