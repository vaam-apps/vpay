# Fixture for `a_top_level_methods_key_is_refused_not_ignored`
# (backends/crates/vpay-config/src/config.rs, ADR-0037, VPA-1 follow-up).
#
# `methods:` written at the top level, with its `auth:` parent forgotten, is not read:
# `Config` does not deny unknown top-level keys, so the deployment would permit
# all four methods while its operator believed they had narrowed them.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

methods: [keypair]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-ci
