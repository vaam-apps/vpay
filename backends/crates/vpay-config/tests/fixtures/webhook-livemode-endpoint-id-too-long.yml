# Fixture for `every_webhook_endpoint_rule_refuses_its_own_fixture`
# (backends/crates/vpay-config/src/config.rs).
#
# The same 65-character `id` as `webhook-endpoint-id-too-long.yml`, under
# `livemode: true`. The pair is the assertion: a rule that mirrors a CHECK
# must not be a livemode rule, and a single fixture could not show that.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: ppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppp
        url: https://hooks.acme.example/vpay
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]
