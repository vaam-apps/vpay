# Fixture for `a_livemode_staff_auth_pepper_written_as_a_literal_is_rejected_by_the_loader`
# (backends/crates/vpay-config/src/config.rs).
#
# `staff-auth-livemode-resolved-secret.yml` with ONE change: the pepper is a
# literal. Nothing else in the file is wrong (https redirect, a registered
# tenant, the TOTP key a placeholder that resolves), so the only rule that can
# fire is the literal-secret one, and the refusal must name the pepper.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

auth:
  methods: [keypair, human_login]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-prod

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-cameroon-tenant
  redirect_uris:
    - https://dashboard.vpay.example/callback
  scope: dashboard:read

staff_auth:
  password_pepper: a-literal-pepper-that-would-be-committed
  totp_encryption_key: ${STAFF_TOTP_ENCRYPTION_KEY}
