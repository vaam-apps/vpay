# Fixture for `a_rail_missing_a_required_credential_is_rejected`
# (backends/crates/vpay-config/src/config.rs). `orange_money` has
# `merchant_key` and `client_id` but no `client_secret`, so the token call
# could never authenticate. Sandbox (`livemode: false`), so the literal
# values below are permitted and the only rule left to fail is the required-key
# one — which is the point of the fixture.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

providers:
  - code: orange_money
    currency: XAF
    host:
      url: http://wiremock-orange:8080/orange-money-webpay/dev
      label: orange-sandbox-wiremock
    credentials:
      merchant_key: merchant-key
      client_id: client-id
