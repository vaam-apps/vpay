# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-1).
#
# The default permits all four, and a merchant with neither `cose_keys` nor
# `jwks` has no way to authenticate at all: refused (MerchantNoCredential),
# not booted into a tenant nobody can call.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    scopes: [payments:write]
