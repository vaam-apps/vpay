# Fixture for `every_webhook_endpoint_rule_refuses_its_own_fixture`
# (backends/crates/vpay-config/src/config.rs).
#
# The stub marker is in the HOST, which is the only place it means anything —
# and it is still refused after the search stopped covering the whole URL.
# `webhook-livemode-accepted-urls.yml` is the other half: the same word in a
# path is a merchant's own URL. Without both, narrowing the search to the host
# and deleting it altogether look identical.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: "https://mock.example/x"
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]
