# Fixture for `a_sandbox_config_with_a_literal_secret_loads`
# (backends/crates/vpay-config/src/config.rs).
#
# The same rail as `livemode-resolved-secret.yml` with the credentials
# written as literals and `livemode: false`. It is the third leg of the
# `validate_secret` table: a literal is refused in livemode and permitted in
# sandbox, and a sandbox deployment is exactly where an operator has a stub
# rail's throwaway key to hand. Without this case, "run the rule against the
# raw text" could be implemented as "always refuse a literal" and nothing
# would notice until a developer's local stack stopped booting.

deployment:
  name: vpay-sandbox
  livemode: false
  public_base_url: http://localhost:8080

providers:
  - code: mtn_momo
    currency: EUR
    host:
      url: http://wiremock-mtn:8080
      label: mtn-sandbox-wiremock
    settings:
      target_environment: sandbox
      api_user: 11111111-2222-3333-4444-555555555555
    credentials:
      subscription_key: sub-key-literal
      api_key: api-key-literal

currencies:
  - code: EUR
    exponent: 2
