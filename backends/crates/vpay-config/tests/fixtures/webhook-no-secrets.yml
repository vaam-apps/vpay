# Fixture for `a_webhook_endpoint_must_declare_one_or_two_secrets`
# (backends/crates/vpay-config/src/config.rs).
#
# An empty `secrets:` list. `vpay_worker::webhooks::handle_deliver` refuses to
# send an unsigned body, so this endpoint would be configured, look healthy,
# and silently receive nothing — which is the failure this rule turns into a
# refusal to boot.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: http://receiver.internal/webhooks
        secrets: []
