# Fixture for `every_webhook_endpoint_rule_refuses_its_own_fixture`
# (backends/crates/vpay-config/src/config.rs).
#
# The same 2049-character URL under `livemode: true`, and https so the length
# is the only defect — `validate_host` would otherwise answer first and the
# case would prove nothing about the bound.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: https://hooks.acme.
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]
