# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-3).
#
# `human_login` named explicitly with neither of its blocks: refused
# (AuthMethodNotConfigured, naming `staff_auth`), as `machine_tokens` named
# with no `jwks` is.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

auth:
  methods: [keypair, human_login]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-ci
