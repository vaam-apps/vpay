# Fixture for `a_livemode_webhook_endpoint_pointing_at_a_stub_is_rejected`
# (backends/crates/vpay-config/src/config.rs).
#
# https, and still refused: the host carries a stub marker. This is the
# leftover a sandbox-to-production copy actually produces — the WireMock
# receiver `compose.e2e.yml` runs, still named in a file whose `livemode` was
# flipped to true. Live events would then be delivered to a container nobody
# is watching, and the merchant would be told nothing.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: https://wiremock-webhook.internal/webhooks
        secrets: ["${MERCHANT_WEBHOOK_SECRET}"]
