# Fixture for `a_livemode_config_with_a_literal_secret_is_rejected`
# (backends/crates/vpay-config/src/config.rs). The host is https and not
# stub-labelled and every required settings key is present, so validate_host
# and validate_required_rail_keys both pass; the ONLY defect in this file is
# the literal (non-`${VAR}`) credential value below. That matters: while the
# rail's `settings` were missing, this fixture would have gone on failing
# even if the literal-secret rule were deleted — just with a different
# error, and only because `validate_secret` happens to run first in the
# loop.

deployment:
  name: prod
  livemode: true
  public_base_url: https://api.vpay.example

providers:
  - code: mtn_momo
    currency: EUR
    host:
      url: https://proxy.momoapi.mtn.com
      label: mtn-cm-prod
    settings:
      target_environment: mtncameroon
      api_user: a-uuid-that-is-not-a-secret
    credentials:
      subscription_key: also-a-literal
      api_key: hunter2
