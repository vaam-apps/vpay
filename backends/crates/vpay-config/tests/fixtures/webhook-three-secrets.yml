# Fixture for `a_webhook_endpoint_must_declare_one_or_two_secrets`
# (backends/crates/vpay-config/src/config.rs).
#
# Three secrets: a rotation nobody finished. Every one of them is a `v1=` on
# every delivery, and the oldest is a live, unrevoked forging key. Refused
# rather than truncated, so the operator decides which two survive.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
    webhooks:
      - id: primary
        url: http://receiver.internal/webhooks
        secrets: [whsec-one, whsec-two, whsec-three]
