# Fixture for `a_duplicate_client_id_across_merchant_and_service_is_rejected`
# (backends/crates/vpay-config/src/config.rs). `client_id` is one namespace
# across every merchant and every service combined (crate::console module
# docs) — `shared-id` here is reused by both, which must be fatal.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: shared-id
    merchant_id: shared-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]

service_clients:
  - client_id: shared-id
    capabilities: [console_pairing]
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
