# Fixture for `a_livemode_staff_auth_written_as_placeholders_loads_and_carries_the_resolved_values`
# (backends/crates/vpay-config/src/config.rs).
#
# A livemode deployment that serves `human_login`, written the way the runbook
# says: https redirect, both `staff_auth` secrets `${VAR}` references, every one
# of which RESOLVES. The pair to `staff-auth-livemode-literal-secret.yml`, and
# for the reason `livemode-resolved-secret.yml` gives: the literal-secret rule
# must be asked of the text BEFORE substitution, and a fixture that only ever
# fails proves nothing about whether a correctly written one loads. These two
# go through the loader (`Config::load_with_env`), which is the only thing that
# supplies the pre-substitution text; a test that injects it by hand cannot see
# the loader stop doing so.

deployment:
  name: vpay-prod
  livemode: true
  public_base_url: https://api.vpay.example

auth:
  methods: [keypair, human_login]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-prod

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-cameroon-tenant
  redirect_uris:
    - https://dashboard.vpay.example/callback
  scope: dashboard:read

staff_auth:
  password_pepper: ${STAFF_PASSWORD_PEPPER}
  totp_encryption_key: ${STAFF_TOTP_ENCRYPTION_KEY}
