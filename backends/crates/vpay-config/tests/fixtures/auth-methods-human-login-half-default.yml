# Fixture for the `auth.methods` rules in
# backends/crates/vpay-config/src/config.rs (ADR-0037, VPA-3).
#
# `auth.methods` absent (everything permitted) and only `dashboard_client`
# written: half a sign-in is refused, not silently not served
# (AuthMethodNotConfigured, naming `staff_auth`).

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    cose_keys:
      - public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        label: acme-ci

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-cameroon-tenant
  redirect_uris:
    - http://localhost:3000/dash/v1/callback
  scope: dashboard:read
