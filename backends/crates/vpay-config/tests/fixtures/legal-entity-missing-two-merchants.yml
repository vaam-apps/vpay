# Fixture for `two_merchants_without_deployment_legal_entity_are_rejected`
# (backends/crates/vpay-config/src/config.rs, RFC-0009 § 6 boot rule 1).
#
# Both merchants are individually valid, with distinct `client_id` and
# `merchant_id`, and neither claims a `legal_entity`, nor does `deployment`.
# A deployment serving two or more merchants must declare whose money it
# collects before it can boot.

deployment:
  name: vpay
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
  - client_id: beta-douala
    merchant_id: beta-douala-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k2
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: ["vpay:v1"]
