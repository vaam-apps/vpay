[package]
name = "vpay-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
vpay-provider.workspace = true
# `JobError` (ADR-0011 Tier 2) wraps `DbError` directly, so the job loop and
# the API can never disagree about whether a Postgres failure is transient —
# both read `Classify::retry` off the same leaf. This crate does not open a
# pool or run a query yet (there is no job loop — docs/status.md); the
# dependency is for the error type alone.
vpay-db.workspace = true
# `JobError` also wraps `LedgerError` (ADR-0011: a composite `#[from]`s every
# leaf its layer can meet). The job loop is what will write ledger
# transactions — a capture, a refund — so an unbalanced one surfaces as a job
# failure, and `LedgerError::Unbalanced` pages while an ordinary job failure
# does not. No cycle: `vpay-ledger` depends on `vpay-core` only, never on
# this crate. It is new to both binaries' graphs (nothing linked it before)
# but adds no third-party package — its own dependencies are all already
# there. Like `vpay-db` above, this is for the error type alone; nothing here
# builds a transaction yet (docs/status.md).
vpay-ledger.workspace = true
# `JobError::Poisoned`/`Exhausted` name the `jobs` row they refer to, and
# that primary key is a UUID everywhere else in the schema
# (backends/migrations/).
uuid.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Constructing a real `DbError::Connect(sqlx::Error::PoolTimedOut)` in the
# `JobError` classification tests, rather than inventing a stand-in error:
# the decision table is only worth anything if the leaf it classifies is the
# same type `vpay_db::connect` actually returns.
sqlx.workspace = true
