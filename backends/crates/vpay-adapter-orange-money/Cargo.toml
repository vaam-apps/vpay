[package]
name = "vpay-adapter-orange-money"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
vpay-provider.workspace = true
# The port's methods are `async fn` behind `#[async_trait]`, so an
# implementor must spell the same attribute (see `ProviderAdapter`'s docs for
# why the port is not a native async trait).
async-trait.workspace = true
# The adapter owns the `reqwest::Client` the binary builds at boot
# (`vpay_provider::http::client_with_timeouts`); naming the type needs the
# direct dependency. No new package: `vpay-provider` already resolves it.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
# `tokio::sync::RwLock` guards the cached rail token. The `sync` feature is
# already on in the workspace entry; no runtime is started here, an adapter
# runs on whichever one its caller provides.
tokio.workspace = true
# NOT here since Step 7: `sha2`. The credential fingerprint moved to
# `vpay_provider::token::fingerprint`, which both adapters now call — one
# length-prefixed digest, not two.
# No `thiserror`: this crate defines no error type of its own. Everything it
# can fail with is already a `vpay_provider::ProviderError` variant, which is
# classified once (ADR-0011) — a leaf enum here would only add a second place
# to decide the same thing.
