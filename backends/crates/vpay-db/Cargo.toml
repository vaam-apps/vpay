[package]
name = "vpay-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
# The metrics facade, for `vpay_charge_transitions_total`. It is recorded by
# `charges::record_transition` and called by the six statements that can move
# `charges.state` — three here and three in `settlement` — because every
# transition passes through this crate and only some pass through the worker
# (a confirm opens and submits a charge inside `vpay-api`). Facade only: no
# recorder is installed from a library, and with none installed every macro
# is a cheap no-op, which is what this crate's own container tests get.
metrics.workspace = true
sqlx.workspace = true
# CrateStack's Postgres data layer, taken here and NOWHERE else in the
# workspace: `mod schema` compiles `schemas/vpay.cstack` into this crate and
# `mod persistence` is the only place a `CratestackError` is read. Every
# generated type stays private (ADR-0016 standard 5), which
# `cargo xtask verify-repositories` now checks rather than trusts.
# `docs/reference/vpay-db.md` § CrateStack says what runs through it and what
# deliberately does not.
cratestack.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The OP's own trait for private_key_jwt replay protection (feature OP-2 /
# ADR-0010). Only the base feature set is needed — `client_assertion` is not
# gated behind any authkestra-op feature — so this inherits exactly the
# `default-features = false, features = ["rustls-no-provider"]` spec from the
# root Cargo.toml's [workspace.dependencies], with nothing added. In
# particular this deliberately does NOT enable authkestra-op's own "sqlx"/
# "sqlx-postgres" feature: that gates authkestra-op's *own* sqlx_store module
# (unused here — vpay-db is the caller, not authkestra-op's store type) and
# would pull sqlx's "chrono" feature into the whole workspace graph, which
# the chrono/time boundary decision below exists specifically to avoid.
authkestra-op.workspace = true
# `ClientAssertionStore::record_jti`'s signature is `chrono::DateTime<Utc>`
# (authkestra-op-0.7.1/src/client_assertion.rs, unchanged since 0.3.4), not vpay's own `time`-crate
# convention. Used only to receive/return that one boundary type in
# src/client_assertion.rs; converted explicitly to time::OffsetDateTime
# before it ever reaches a query bind — see that module's own comment.
chrono.workspace = true
# vpay's own convention (time crate) for every TIMESTAMPTZ column this crate
# binds directly (oauth_signing_keys.expires_at, disabled_clients.disabled_at
# is DB-generated and never bound from Rust).
time.workspace = true
# oauth_signing_keys.public_jwk is JSONB; sqlx's "json" feature (already
# enabled workspace-wide) decodes/encodes it as serde_json::Value directly.
serde_json.workspace = true
# Not written by hand anywhere in this crate: `include_server_schema!` emits
# `#[derive(serde::Serialize, serde::Deserialize)]` by bare path on every
# generated model, input and enum, so `serde` has to be a direct dependency
# of the crate that invokes the macro or the build fails with 110 copies of
# "can't find crate for `serde`". Nothing under `src/` outside `mod schema`
# names it, which is why `cargo xtask verify-serde` has nothing to say about
# this crate — it reads source text, and the generated derives are not source
# text (their field names come from the `.cstack` file, already snake_case).
serde.workspace = true
# `charges.provider_reference_id` and `provider_requests.provider_reference_id`
# are `UUID` columns mirroring `vpay_provider::ChargeRef::reference_id: Uuid`.
# sqlx's "uuid" feature (already enabled workspace-wide) decodes them, but the
# type still has to be nameable in this crate's own row structs and function
# signatures — vpay-db generates no uuids, it only carries them.
uuid.workspace = true
# Constant-time byte comparison for the stored `Idempotency-Key` request hash
# (`idempotency::claim`). A `==` on the digest exits at the first differing
# byte, which turns "is this the same request" into a timing oracle for
# attacker-adjacent data; `ConstantTimeEq` compares all 32 bytes. Already in
# the workspace graph and in Cargo.lock (BSD-3-Clause, on deny.toml's allow
# list), so this adds no new crate to the build.
subtle.workspace = true
# `authkestra_op::client_assertion::ClientAssertionStore` is declared
# `#[async_trait]`; implementing it requires the same expansion pattern.
# Not in [workspace.dependencies] (root Cargo.toml, not owned here) — added
# as a plain member-level dependency, pinned to the same "0.1" authkestra-op
# itself depends on. Different crates implementing the same async-trait
# trait do not need to share an exact patch version; the macro expands to an
# ordinary `-> Pin<Box<dyn Future<...> + Send>>` signature either way.
async-trait = "0.1"

[dev-dependencies]
# Test-only, and deliberately the *shipping* exporter rather than
# `metrics-util`'s `DebuggingRecorder`: `repositories.rs`'s
# `a_settlement_counts_the_transition_it_actually_made` asserts on the
# rendered Prometheus text, which is what a scrape of a pod receives, and it
# is the one test that pins `settlement`'s previous-state sub-select. Already
# resolved at this exact pin by both binaries, so no new package enters
# `Cargo.lock`.
metrics-exporter-prometheus.workspace = true
# Real containers only (ADR-0006 / AGENTS.md rule 1: no mock, fake, stub or
# dummy anywhere reachable — including in how *this crate's own tests* prove
# themselves). See tests/postgres.rs for the pinned image tag.
tokio.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
anyhow.workspace = true
# For `vpay_testkit::containers::start_postgres_with_retry`, the single
# container-start helper every Postgres-backed suite in this workspace shares
# (vpay-server, vpay-worker-bin and vpay-tests-integration already dev-depend
# on it). Dev-only, as ADR-0006 requires and `cargo xtask verify-no-mocks`
# checks; vpay-testkit itself depends only on vpay-core/vpay-provider, so this
# adds no cycle back into vpay-db.
vpay-testkit.workspace = true
