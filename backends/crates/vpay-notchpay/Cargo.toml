[package]
name = "vpay-notchpay"
description = "A typed client for the Notch Pay REST API, transcribed from its OpenAPI specification 2.1.0. Internal to vpay; not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `vpay_core::privacy::Secret` is what every hand-written `Debug` here
# composes, exactly as the port's own types do.
vpay-core.workspace = true
# The client returns the port's `ProviderError` for the two outcomes it can
# classify without knowing what a payment means — a transport failure and an
# answer that does not parse — and reads bodies through the port's bounded
# reader. No error type of its own: see the crate docs.
vpay-provider.workspace = true
# The caller builds the `reqwest::Client` (the binary does it once, at boot,
# through `vpay_provider::http::client_with_timeouts`); naming the type needs
# the direct dependency. No new package: `vpay-provider` already resolves it.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# One test sends a request to a closed loopback port, to prove a transport
# failure is `Transport` and never a refusal. No server, no double. `net` and
# `io-util` serve the probe's redirect test, a plain TCP listener.
tokio = { workspace = true, features = ["net", "io-util"] }
# The rest serve `examples/sandbox_probe.rs` only, which a person runs
# against Notch Pay's real sandbox from docs/runbooks/notchpay-sandbox-test.md:
# fresh references, and item 7's signature check. All four are already in the
# workspace's lockfile.
uuid.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
# `--ca-bundle` only (cloud sessions, see the probe's module doc): the probe
# builds its own client over the vendored roots plus the bundle, so it needs
# the two crates `vpay_provider::http` builds the shared one from. Both are
# already in the workspace's lockfile; no shipping target gains them.
rustls.workspace = true
webpki-roots = "1"

# `test = true`: the probe's own unit tests (the `--ca-bundle` flag is off by
# default, a bad path fails before any request, redirects stay refused) run
# under `cargo nextest run --workspace`. That makes the example a test binary,
# which `justfile`'s `expected_suites` counts.
[[example]]
name = "sandbox_probe"
test = true
