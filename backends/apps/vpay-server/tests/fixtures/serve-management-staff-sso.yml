# Fixture for the `vpay-server serve` subprocess test of a MANAGEMENT-ONLY pod
# that serves `human_login` WITH single sign-on (ADR-0037, ADR-0030, VPA-4): the
# `serve-management-human-login.yml` deployment plus a `staff_auth.sso` block.
#
# What the test proves with it is the wiring only `serve` performs: the provider
# is built from the block by `StaffLogin::from_config`, so `GET
# /dash/v1/staff/sso` says `enabled: true` here and `enabled: false` on the
# fixture without the block, and `start` is mounted (it reaches the provider,
# which is unreachable by design, and is refused with the module's one `401`
# rather than a `404`). The issuer is never contacted at boot: discovery is lazy.

deployment:
  name: vpay-server-cli-test
  livemode: false
  public_base_url: http://localhost:8080
  surfaces: [management]

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: [vpay:v1]

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-cameroon-tenant
  scope: dashboard:read
  redirect_uris:
    - http://localhost:3000/api/auth/callback

staff_auth:
  password_pepper: a-test-pepper-that-is-not-a-real-secret
  totp_encryption_key: ${VPAY_TEST_STAFF_TOTP_KEY}
  sso:
    issuer: http://127.0.0.1:1/realms/staff
    client_id: vpay-staff
    client_secret: a-test-client-secret-that-is-not-real
    redirect_uri: http://localhost:3000/api/auth/sso/callback
    required_group: vpay-staff
    accepted_amr: [otp]
