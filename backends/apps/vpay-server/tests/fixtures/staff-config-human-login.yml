# Fixture for the `vpay-server staff add` subprocess tests that need a
# deployment serving `human_login` (ADR-0037, VPA-3): a merchant registration to
# validate `--merchant` against, and BOTH blocks of the method, `dashboard_client`
# and `staff_auth`. `auth.methods` is absent, which permits every method, so the
# two blocks are what serve the sign-in and `staff add` mints a one-time password.
#
# `livemode: false`, so the secrets below may be literals: the `LiteralSecret`
# rule is a *livemode* rule, and a fixture that had to resolve `${VAR}`s would
# make every subprocess test depend on the runner's environment. The values are
# visibly test values for the same reason.

deployment:
  name: vpay-server-cli-test
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: [vpay:v1]

dashboard_client:
  client_id: vpay-dashboard
  merchant_id: acme-cameroon-tenant
  scope: dashboard:read
  redirect_uris:
    - http://localhost:3000/api/auth/callback

staff_auth:
  password_pepper: a-test-pepper-that-is-not-a-real-secret
  # 32 zero bytes, base64url-encoded and unpadded: the length
  # `vpay_api::staff_auth::secret_box::KEY_BYTES` requires.
  totp_encryption_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
