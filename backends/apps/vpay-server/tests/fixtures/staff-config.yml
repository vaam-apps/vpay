# Fixture for the `vpay-server staff add` subprocess tests in
# `backends/apps/vpay-server/tests/cli.rs` (ADR-0036).
#
# It carries the two things `staff add` and `staff pair-key` read and nothing
# else: a merchant registration to validate `--merchant` against and a
# `dashboard:` block (without one there is no console to read, and `/dash/v1`
# is not mounted). There is no secret in it: the credentials this fixture used
# to carry (a password pepper, a TOTP key) were deleted with their sign-in.

deployment:
  name: vpay-server-cli-test
  livemode: false
  public_base_url: http://localhost:8080

merchant_clients:
  - client_id: acme-cameroon
    merchant_id: acme-cameroon-tenant
    jwks:
      keys:
        - kty: RSA
          kid: k1
          n: placeholder
          e: AQAB
    grant_types: [client_credentials]
    allowed_audiences: [vpay:v1]

dashboard:
  merchant_id: acme-cameroon-tenant
