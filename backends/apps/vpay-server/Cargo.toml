[package]
name = "vpay-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
vpay-config.workspace = true
vpay-db.workspace = true
vpay-provider.workspace = true
vpay-adapter-mtn-momo.workspace = true
vpay-adapter-orange-money.workspace = true
vpay-api.workspace = true
vpay-worker.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
# `StartupError` (src/main.rs): the one typed leaf this binary defines, so a
# required flag that was not supplied exits 78 rather than falling through
# `exit_code_for`'s unclassified-is-a-bug fallback to 1. ADR-0011 puts
# `anyhow` at the boundary and `thiserror` at the leaves; this binary now has
# one leaf of its own, for a requirement that belongs to this process and not
# to `vpay-config` (see the type's doc comment).
thiserror.workspace = true
mimalloc.workspace = true
clap.workspace = true
# Installs the process-wide rustls `CryptoProvider` in `main` (see
# `install_crypto_provider` in src/main.rs). The workspace pin already
# selects `ring`, the only provider `deny.toml` permits; this binary needs
# the crate directly because `reqwest` is pinned `rustls-no-provider` and
# panics when it builds a client with no process default installed (root
# Cargo.toml's comments on the `reqwest` and `authkestra-*` pins).
rustls.workspace = true
# The metrics facade and its Prometheus text exporter. `install_recorder()`
# in main.rs installs exactly one recorder per process — a decision that
# belongs to the binary, not to a library (see `vpay_core::metrics`) — and
# `vpay_api::observability` renders its handle on `--observability-bind`.
# The exporter is pinned `default-features = false` in the root Cargo.toml;
# its `push-gateway` default would pull `aws-lc-rs`, which `deny.toml` bans.
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
# `adapters()` names `reqwest::Client` in its signature — the one client this
# process builds at boot (`vpay_provider::http::client_with_timeouts`) and
# hands to every rail adapter. Already resolved in this binary's graph via
# vpay-provider/vpay-api and the authkestra stack, at the same 0.13 pin: an
# edge, not a new package.
reqwest.workspace = true

[dev-dependencies]
vpay-testkit.workspace = true
# Real containers only (ADR-0006 / AGENTS.md rule 1) — the subprocess CLI
# tests in tests/cli.rs now spawn a real `vpay-server`, which requires a real
# `--database-url` since it is no longer optional at the application layer
# (see main.rs). See tests/cli.rs for the pinned image tag and why one
# container is shared per test function rather than per SIGTERM-race attempt.
testcontainers.workspace = true
testcontainers-modules.workspace = true
# Test-only: `tests/cli.rs` generates a real RSA private key per run and
# writes it to `CARGO_TARGET_TMPDIR`, because `vpay-server` now requires
# `--oauth-signing-key-file` at boot and a PEM committed to the repository
# would be a private key in version control. Already in the resolved graph
# via `authkestra-engine`; pinned directly at the same "0.9" `vpay-api` uses
# for the same purpose (neither is a workspace dependency).
rsa = "0.9"
# Test-only: `rsa`'s key generation takes an `OsRng` from `rand` 0.8, which
# is the workspace pin and is what `vpay-api`'s own key fixtures use.
rand.workspace = true
# Test-only, both of them: `exit_code_for`'s unit test constructs the two
# `vpay_db::DbError` leaves whose exit codes must differ (a rollback to a
# retired signing key -> 78, an unreachable database -> 69), and those
# variants carry a `time::OffsetDateTime` and a `sqlx::Error` respectively.
# Neither adds a package to any graph — `vpay-db`, which this binary already
# links, depends on both at these same workspace pins; they are named here
# only so the test can spell the types.
time.workspace = true
sqlx.workspace = true
