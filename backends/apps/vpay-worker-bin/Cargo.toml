[package]
name = "vpay-worker-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vpay-core.workspace = true
vpay-config.workspace = true
vpay-db.workspace = true
vpay-provider.workspace = true
vpay-adapter-mtn-momo.workspace = true
vpay-adapter-orange-money.workspace = true
vpay-api.workspace = true
vpay-worker.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
mimalloc.workspace = true
clap.workspace = true
# Installs the process-wide rustls `CryptoProvider` in `main` (see
# `install_crypto_provider` in src/main.rs). The workspace pin already
# selects `ring`, the only provider `deny.toml` permits; this binary needs
# the crate directly because `reqwest` is pinned `rustls-no-provider` and
# panics when it builds a client with no process default installed (root
# Cargo.toml's comments on the `reqwest` and `authkestra-*` pins).
rustls.workspace = true
# `adapters()` names `reqwest::Client` in its signature — the one client this
# process builds at boot (`vpay_provider::http::client_with_timeouts`) and
# hands to every rail adapter. Already resolved in this binary's graph via
# vpay-provider/vpay-api and the authkestra stack, at the same 0.13 pin: an
# edge, not a new package.
reqwest.workspace = true

[dev-dependencies]
vpay-testkit.workspace = true
# Real containers only (ADR-0006 / AGENTS.md rule 1) — see
# backends/apps/vpay-server/Cargo.toml's identical note; tests/cli.rs here
# has the same shape.
testcontainers.workspace = true
testcontainers-modules.workspace = true
