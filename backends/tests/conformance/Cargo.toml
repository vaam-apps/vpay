[package]
name = "vpay-tests-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]

[dev-dependencies]
vpay-core.workspace = true
vpay-provider.workspace = true
vpay-adapter-mtn-momo.workspace = true
vpay-adapter-orange-money.workspace = true
vpay-testkit.workspace = true
tokio.workspace = true
rstest.workspace = true
# Naming `ContainerAsync<GenericImage>` — the rail stub each wire-level case
# owns for its duration, started by `vpay_testkit::containers::start_wiremock`.
# The container has to be *held* by the test (dropping it removes it), so the
# type cannot stay behind the testkit's API.
testcontainers.workspace = true
# `ChargeRef::reference_id` is a `Uuid`, and every case selects its stubbed
# response by reference — see the mapping contract in the suite's module doc.
uuid.workspace = true
# The account-holder cases assert on what an operator would SEE, not on the
# arguments a macro was called with:
# `an_account_holder_body_of_personal_data_yields_a_name_and_leaks_nothing`
# installs a scoped subscriber over the port call and greps the captured
# output. A test that asserted "we did not call `tracing::info!`" would pass
# the day someone logged the body from a different macro; capturing the sink
# is the only assertion that cannot.
#
# NOT a test double under ADR-0006: nothing is substituted for the adapter,
# the client or the rail — this is a writer attached to the real `tracing`
# output of the real code under test.
tracing.workspace = true
tracing-subscriber.workspace = true

# NOT here, deliberately: the Rust `wiremock` crate. ADR-0006 makes a rail stub
# a WireMock *container* reached over HTTP; an in-process double would replace
# the very transport these cases exist to exercise. `cargo xtask
# verify-no-mocks` does not police a dev-dependency (it cannot — this whole
# package is test-only), so this comment is the guard, along with the fact that
# nothing here would compile against it.
