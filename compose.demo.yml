# The e2e stack, plus one registered merchant the local demo can authenticate as.
#
#   docker compose -f compose.yml -f compose.e2e.yml -f compose.demo.yml up -d --build
#
# `just demo` is the supported entry point; this file is never used alone. It
# layers on top of compose.e2e.yml and changes exactly two things per service:
# which profile the process loads, and one extra read-only bind mount.
#
# # Why a profile overlay and not an edit to config/application.yml
#
# ADR-0003: a profile selects a *config file*, never a code path. The demo
# merchant's key pair is generated per checkout by `just gen-demo-keys` and
# lives in `.e2e/`, which is git-ignored — so its public JWK cannot be
# committed to `config/application.yml`, and the base file's
# `merchant_clients` entry is a placeholder modulus that could never verify an
# assertion. `VPAY_PROFILE: demo` makes vpay-config look for
# `application-demo.yml` beside the base file (its
# `profile_overlay_path`: `<dir>/<stem>-<profile>.<ext>`), which is what the
# bind mount below puts there. The image bakes the base file at
# `/config/application.yml` (backends/Dockerfile), so `/config/` is the
# directory that has to receive it.
#
# **A missing overlay is not an error.** `Config::load_with_env` merges the
# overlay only `if overlay_path.is_file()`, so a stack brought up with
# `VPAY_PROFILE: demo` and no `application-demo.yml` boots happily on the base
# file alone — with `acme-cameroon`'s placeholder modulus as the entire
# merchant registry, and therefore an `invalid_client` at the first token
# request and no hint as to why. That is what makes the bind mount below
# load-bearing rather than convenient, and why `just demo` runs
# `gen-demo-keys` before it runs `docker compose up`.
#
# # What the overlay replaces, and what it keeps
#
# figment deep-merges maps but a *list* in an overlay replaces the base list
# wholesale (docs/flows/configuration.md). `merchant_clients` is a list, so
# the demo profile's single `demo-merchant` entry is the entire registry while
# this stack is up — `acme-cameroon` from the base file is gone, which is
# correct: nobody holds its private key. Everything the overlay does not
# mention (`providers`, `currencies`, `deployment.public_base_url`,
# `dashboard_client`) still comes from the base file.
#
# Note this stack loads `application-demo.yml` *instead of*
# `application-sandbox.yml`, not in addition to it — vpay-config loads one
# overlay, the one named by the profile. The only thing sandbox changed that
# this does not is the dashboard's redirect URI, which nothing in the demo
# exercises.

# The COMPOSE PROJECT NAME, and the one thing in this file that decides
# whether two demos can run on one machine at once.
#
# Compose merges `name:` by last-file-wins, and this file is always last
# (`just`'s `demo_compose`), so this value — not compose.yml's `vpay` — is the
# project every `docker compose … -f compose.demo.yml` command addresses. It
# is what prefixes every container (`<project>-vpay-server-1`), names the
# default network, and namespaces the `pgdata` volume, so two stacks with
# different values share nothing and neither `up` nor `down -v` can touch the
# other's rows.
#
# It used to read `name: vpay`, which made the demo stack and `just up`'s
# development stack THE SAME PROJECT: `just demo` adopted (and `just
# demo-down -v` deleted the volumes of) whatever `just up` had left running,
# and two demos could not coexist however their ports were remapped. The
# default is now `vpay-demo` — a project of its own, still fixed, so the
# single-user path needs no flags.
#
# `just demo` exports this from its `demo_project` variable (`just
# demo_project=vpay-demo-b demo_port=18088 demo_receiver_port=18089 demo`);
# the `:-vpay-demo` default keeps a bare `docker compose -f … up` working and
# keeps this file readable without `just`. Compose restricts a project name to
# lowercase letters, digits, `-` and `_`, starting with a letter or digit.
name: ${VPAY_DEMO_PROJECT:-vpay-demo}

services:
  postgres:
    # `!reset`, i.e. publish nothing on the host — NOT a remap.
    #
    # This is the one thing compose.demo.yml changes that is not about the
    # demo merchant, and it is deliberate. Nothing in the demo talks to
    # Postgres from the host: `vpay-server` reaches it over the compose
    # network, and `examples/merchant-demo` only ever speaks HTTP to :8080.
    # What the `5432:5432` publication in compose.yml *does* buy is a hard
    # prerequisite that the single most commonly occupied port on a
    # developer's machine be free — a local Postgres, or any other project's
    # compose stack, and `just demo` dies on "port is already allocated"
    # before a single line of the demo runs. That happened on the machine
    # this was written on. :5432 buys the demo nothing.
    #
    # `docker compose exec postgres psql -U vpay vpay` still gets you a shell
    # on it. Use `just up` (compose.yml alone) if you want the port published.
    ports: !reset []

  # The two rail stubs, unpublished for the same reason and by the same
  # mechanism as `postgres` above — and this one is what actually makes two
  # concurrent demos possible.
  #
  # `demo_project`, `demo_port` and `demo_receiver_port` between them move
  # everything a second demo would otherwise fight over EXCEPT these: 8081 and
  # 8082 are fixed literals in compose.yml, they are appended (not replaced)
  # by a plain `ports:` here, and a second `up` on the same machine dies on
  # "port is already allocated" before any of the three variables gets a
  # chance to matter. Nothing in the demo reaches a rail stub from the host:
  # `vpay-server` and `vpay-worker` talk to `wiremock-mtn:8080` /
  # `wiremock-orange:8080` over the compose network, which is what
  # `config/application.yml` names.
  #
  # Reading what vpay actually sent a rail is still one command, and it is the
  # one docs/runbooks/demo.md uses:
  #
  #     docker compose $DEMO_COMPOSE exec wiremock-mtn \
  #         curl -s localhost:8080/__admin/requests
  #
  # `just up` (compose.yml alone) still publishes both if you want them.
  wiremock-mtn:
    ports: !reset []

  wiremock-orange:
    ports: !reset []

  vpay-server:
    # `!override`, not an addition. Compose merges `ports:` across files by
    # appending, so a plain `ports:` here would leave compose.e2e.yml's
    # `8080:8080` in place *as well* — and the whole point of the variable is
    # that 8080 may already be taken, which would fail the whole `up` with
    # "port is already allocated". `!override` replaces the list outright.
    #
    # `just demo` exports `VPAY_DEMO_PORT` from its `demo_port` variable
    # (`just demo_port=18080 demo`); the `:-8080` default keeps a bare
    # `docker compose -f ... -f compose.demo.yml up` working, and keeps this
    # file readable as a document about the demo rather than about `just`.
    #
    # The CONTAINER port stays 8080 — that is what `vpay-server` binds
    # (`--bind 0.0.0.0:8080` in compose.e2e.yml) and what the dashboard
    # reaches over the compose network as `http://vpay-server:8080`. Only the
    # host side moves, which is why nothing inside the stack has to know.
    # compose.e2e.yml itself is untouched: CI's e2e job still gets 8080.
    ports: !override ["${VPAY_DEMO_PORT:-8080}:8080"]
    environment:
      VPAY_PROFILE: demo
    volumes:
      # `docker compose` merges `volumes:` across files by target path, so the
      # `/secrets/oauth-signing-key.pem` mount from compose.e2e.yml survives —
      # verify with `docker compose -f compose.yml -f compose.e2e.yml -f
      # compose.demo.yml config` before trusting that sentence again after a
      # Compose upgrade.
      #
      # Read-only, and world-readable on the host (`just gen-demo-keys` chmods
      # it 0644) because the scratch image runs as UID 65532. That is safe
      # here in a way the *signing* key's 0644 is not quite: this file holds
      # only the merchant's PUBLIC JWK. The merchant's private key stays on
      # the host in `.e2e/demo-merchant/`, mode 0600, and is never mounted
      # into any container — the demo binary runs outside the stack, exactly
      # as a merchant's own process would.
      - ./.e2e/application-demo.yml:/config/application-demo.yml:ro

  # The merchant webhook receiver from compose.e2e.yml, republished on a
  # port the `just demo` variable controls.
  #
  # `!override` for the identical reason `vpay-server`'s `ports:` is: compose
  # APPENDS `ports:` across files, so a plain list here would leave
  # compose.e2e.yml's `8083:8083` in place as well and `just
  # demo_receiver_port=…` would fail the whole `up` on "port is already
  # allocated" — the exact thing the variable exists to avoid.
  #
  # The demo binary runs on the HOST (as a merchant's own process would), so
  # it reads this container's request journal over the published port. The
  # container port stays 8080: that is what
  # `.e2e/application-demo.yml`'s `webhooks[0].url` names over the compose
  # network, and nothing inside the stack has to know the host mapping.
  wiremock-webhook:
    ports: !override ["${VPAY_DEMO_RECEIVER_PORT:-8083}:8080"]

  # NOTE ON `dashboard`. This file does not mention it, and `just demo-up`
  # does not start it — the recipe names the six services the walkthrough
  # needs (postgres, both rail stubs, the receiver, the server, the worker)
  # exactly as `just stripe-compat` already did. Two reasons, one of them
  # honest rather than practical: building `frontends/Dockerfile` costs
  # minutes, and per docs/status.md the dashboard renders a static scaffold
  # notice and makes no call to `vpay-server` — there is no data source to
  # show, so a demo that booted it would be inviting a reader to look at a
  # screen that cannot show the payments the walkthrough just made
  # (docs/runbooks/demo.md says so out loud). Its `3000:3000` publication is
  # therefore left exactly as compose.e2e.yml has it: unreached by the demo,
  # and still there for `docker compose -f compose.yml -f compose.e2e.yml up`.
  vpay-worker:
    environment:
      VPAY_PROFILE: demo
    volumes:
      # The worker has no use for a merchant registry. It gets the same mount
      # so that both processes in the stack resolve `demo` to the *same*
      # document: a profile that exists for one process and silently does not
      # for the other is a divergence nothing would report, because a missing
      # overlay is not an error (see the note above).
      - ./.e2e/application-demo.yml:/config/application-demo.yml:ro
